# The development tools and tasks (CONTRIBUTING.md); longer tasks are scripts
# in mise-tasks/. Python's version comes from backend/pyproject.toml, through
# uv; Node's is here, for mise and for CI.

[tools]
node = "26.12.1"
uv = "0.13.6"
shellcheck = "0.11.0"
taplo = "0.10.0"
"npm:markdownlint-cli2" = "0.24.0"

[tasks.check]
description = "Check the backend, the frontend, the browser tests, the task scripts, the Markdown and the TOML"
depends = [
    "check-backend",
    "check-frontend",
    "check-browser",
    "check-changed-lines",
    "check-scripts",
    "check-markdown",
    "check-toml",
]

[tasks.check-backend]
description = "Type check, lint, format check and test the backend"
dir = "backend"
run = [
    "uv run ty check",
    "uv run ruff check",
    "uv run ruff format --check",
    # Across processes: CONTRIBUTING.md, Running the checks.
    "uv run pytest -n auto --maxprocesses=8 --cov --cov-report=term --cov-report=xml",
]

[tasks.test-without-database]
description = "Run every backend test that needs no PostgreSQL, with no database"
dir = "backend"
run = 'uv run pytest -m "not database"'

[tasks.check-frontend]
description = "Type check, lint, format check and test the frontend"
dir = "frontend"
run = ["npm run typecheck", "npm run lint", "npm run coverage"]

[tasks.check-browser]
description = "Browser tests: the built app, in a real browser at a phone's width"
dir = "frontend"
depends = ["setup-browsers", "start-database"]
run = [
    "npm run build",
    "npx playwright test",
]

[tasks.browser-webkit]
description = "The browser tests in WebKit, in Playwright's container, for systems its WebKit does not run on"
dir = "frontend"
depends = ["start-database", "ports-free INVENTORY_WEBKIT_PORT"]
run = [
    "mise run compose -- --profile webkit up -d --wait webkit",
    "npm run build",
    # The server's port as compose publishes it: the shell's, else .env's.
    """
    port=$(cd ../backend && uv run --quiet --frozen python -m inventory_tng.stacks port INVENTORY_WEBKIT_PORT)
    PLAYWRIGHT_WEBKIT=1 PLAYWRIGHT_WEBKIT_SERVER="ws://127.0.0.1:${port}/" \
      npx playwright test --project=webkit
    """,
]

[tasks.check-changed-lines]
description = "Every line changed since origin/main is run by a test"
depends = ["check-backend", "check-frontend"]
run = """
uv run --project backend diff-cover -c backend/pyproject.toml \
  backend/coverage.xml frontend/coverage/cobertura-coverage.xml \
  --include-untracked
"""

[tasks.measure-catalogue]
description = "Time the scan page's catalogue against years of saves, with its ledger queries' plans"
dir = "backend"
depends = ["start-database"]
run = [
    "uv run pytest tests/measure_catalogue.py -p no:randomly -p no:cacheprovider -q -s",
]

[tasks.regenerate-fold-reference]
description = "Write tests/fold_reference.tsv again, after a release of anyascii, or a Python with a newer Unicode, changes how it folds (CONTRIBUTING.md)"
dir = "backend"
run = "uv run python -m tests.helpers.fold_reference"

[tasks.check-markdown]
description = "Lint every Markdown file the project writes (AGENTS.md rule 9)"
run = "markdownlint-cli2"

[tasks.check-scripts]
description = "Lint the task scripts in mise-tasks/"
run = "shellcheck mise-tasks/*"

[tasks.check-toml]
description = "Lint and check the formatting of every TOML file"
env = { RUST_LOG = "warn" }
run = ["taplo lint", "taplo fmt --check"]

[tasks.fix]
description = "Fix what ruff, Biome and markdownlint can fix, and format, TOML too"
depends = ["fix-backend", "fix-frontend", "fix-markdown", "fix-toml"]

[tasks.fix-backend]
description = "Fix what ruff can fix, and format the backend"
dir = "backend"
run = ["uv run ruff check --fix", "uv run ruff format"]

[tasks.fix-frontend]
description = "Fix what Biome can fix, and format the frontend"
dir = "frontend"
run = "npm run fix"

[tasks.fix-markdown]
description = "Fix what markdownlint can fix in the project's Markdown"
run = "markdownlint-cli2 --fix"

[tasks.fix-toml]
description = "Format every TOML file"
env = { RUST_LOG = "warn" }
run = "taplo fmt"

[tasks.seed]
description = "Seed an empty development database (CONTRIBUTING.md); -- --password sets the administrator's"
depends = ["dev-database"]
dir = "backend"
run = "uv run python -m inventory_tng.seed"

[tasks.dev-database]
description = "This checkout's development database: the server started, the database made if missing, and migrated"
dir = "backend"
depends = ["start-database"]
run = [
    "uv run python -m inventory_tng.dev_database make",
    "uv run alembic upgrade head",
]

# This checkout's stack (CONTRIBUTING.md, Local settings).
[tasks.start-database]
description = "Start this checkout's database server, making its container again (its volume kept) when compose.yaml or .env changed its settings"
depends = ["ports-free INVENTORY_DB_PORT"]
run = "mise-tasks/compose up -d --wait db"

# Each task that starts something runs it first, naming the settings of the
# ports it needs (CONTRIBUTING.md, Local settings).
[tasks.ports-free]
description = "Stop, saying what holds it and what to do, unless each port named (-- [--here] INVENTORY_DB_PORT ...) is free or this checkout's stack's"
dir = "backend"
run = "uv run --quiet --frozen python -m inventory_tng.stacks ports-free"

[tasks.dev-backend]
description = "The backend on INVENTORY_APP_PORT, restarting when its Python changes (mise run dev runs it)"
dir = "backend"
depends = ["ports-free --here INVENTORY_APP_PORT"]
# VITE_DEV_SERVER works only in development.
env = { APP_ENV = "development" }
run = """
uv run python -m inventory_tng --reload \
  --port "$(uv run --quiet --frozen python -m inventory_tng.stacks port INVENTORY_APP_PORT)"
"""

[tasks.dev-vite]
description = "Vite's dev server, for the frontend, on INVENTORY_VITE_PORT (mise run dev runs it)"
dir = "frontend"
depends = ["ports-free --here INVENTORY_VITE_PORT"]
run = "npm run dev"
