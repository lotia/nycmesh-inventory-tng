# The development tasks (CONTRIBUTING.md); longer ones are scripts in
# mise-tasks/. Python's version comes from backend/pyproject.toml; Node's is
# here, for mise and for CI.

[tools]
node = "26.12.1"
shellcheck = "0.11.0"

[tasks.check]
description = "Check the backend, the frontend and the task scripts"
depends = ["check-backend", "check-frontend", "check-scripts"]

[tasks.check-backend]
description = "Type check, lint, format check and test the backend"
dir = "backend"
run = [
  "uv run ty check",
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run pytest",
]

[tasks.check-frontend]
description = "Type check, lint, format check and test the frontend"
dir = "frontend"
run = ["npm run typecheck", "npm run lint", "npm test"]

[tasks.check-scripts]
description = "Lint the task scripts in mise-tasks/"
run = "shellcheck mise-tasks/*"

[tasks.fix]
description = "Fix what ruff and Biome can fix, and format"
depends = ["fix-backend", "fix-frontend"]

[tasks.fix-backend]
description = "Fix what ruff can fix, and format the backend"
dir = "backend"
run = ["uv run ruff check --fix", "uv run ruff format"]

[tasks.fix-frontend]
description = "Fix what Biome can fix, and format the frontend"
dir = "frontend"
run = "npm run fix"
