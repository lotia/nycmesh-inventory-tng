# Local development stack: `docker compose up`.
# Setup walkthrough lives in DEVELOPERS.md; this file is not used in
# production, where the Helm chart in infra/helm/ deploys the same images.

name: inventory-tng

# What every service in this stack is denied, in one place because it is one
# decision: no container may gain a privilege, none holds a capability, and
# none may write to its own root filesystem. DEVELOPERS.md "Option A" says so
# in prose and the `Compose stack` job in CI finds out whether it is true.
#
# The uid each runs as and the directories each genuinely writes to are not
# here: those differ per image, and stating them beside the service is what
# makes an unexplained tmpfs visible.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true

services:
  postgres:
    image: docker.io/library/postgres:18-bookworm
    <<: *hardened
    # The uid the image's own `postgres` account has. Named here rather than
    # left to the entrypoint, which starts as root and drops to it: stated, the
    # container never holds root at all, and dropping every capability above
    # therefore costs it nothing.
    user: "999:999"
    tmpfs:
      # The data lives on the volume below. These two are the only other places
      # written: the unix socket, and the temporary file the entrypoint puts
      # the initial password in while it creates the cluster. A mode is given
      # because a tmpfs is root-owned otherwise and nothing here runs as root,
      # which also makes the entrypoint's own chmod of the socket directory
      # fail harmlessly and say so once at startup.
      - /var/run/postgresql:mode=1777
      - /tmp:mode=1777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_tng}
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
    ports:
      # The published port is configurable because a laptop that has done any
      # database work already has something on 5432, and the bind failure that
      # produces is the commonest way a first setup stops. Whatever this is set
      # to, DATABASE_URL has to name the same number -- see .env.sample.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18+ keeps data in major-version subdirectories under
      # /var/lib/postgresql and refuses to start if it finds a mount at the
      # older /var/lib/postgresql/data path. Mount the parent.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
    <<: *hardened
    # The uid backend/Dockerfile creates and switches to. Repeated here so the
    # restraint is visible in the file that runs the image rather than only in
    # the one that builds it, and so a rebuild that lost the USER line would
    # not quietly hand this stack a root container.
    user: "1001:1001"
    tmpfs:
      # gunicorn keeps a per-worker heartbeat file under the temporary
      # directory and touches it every second, so this one is not optional.
      # Nothing else in the image writes: static files are collected at build
      # time and PYTHONDONTWRITEBYTECODE keeps .pyc files out.
      - /tmp:mode=1777
      # gunicorn 26 also puts its control socket under the account's home. It
      # carries on without one, but it logs the refusal at ERROR on every
      # start, and a stack whose first log line is an error teaches whoever
      # brought it up to skim past errors.
      - /home/app:mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-not-for-deployment-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DJANGO_LOG_LEVELS: ${DJANGO_LOG_LEVELS:-}
      # json rather than the console default, because this stack is meant to
      # demonstrate the deployed arrangement rather than a friendlier one.
      # Pipe it back into columns to read it:
      #   docker compose logs -f backend | scripts/pretty-logs
      DJANGO_LOG_FORMAT: ${DJANGO_LOG_FORMAT:-json}
      # How much a refused request may write, which this stack passes through
      # so that a scanner found on a laptop's LAN behaves as it would deployed.
      DJANGO_SECURITY_LOG_RATE: ${DJANGO_SECURITY_LOG_RATE:-10/min}
      # Traces and metrics. Empty by default: no endpoint means no SDK, so
      # this stack costs nothing until somebody asks for the collector below,
      # which is what fills this in. 1.0 rather than the code's conservative
      # default, because what is wanted should be in a file rather than
      # implied. docs/observability.md is the command.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-inventory-tng-backend}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=compose}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      # Redacted, like every configuration here ships. Set it to `recorded` in
      # .env for the afternoon you need to see an address or a query, and read
      # what that makes true in .env.sample before you do.
      TELEMETRY_PERSONAL_DATA: ${TELEMETRY_PERSONAL_DATA:-redacted}
      DEBUG_TRACE_LIFETIME_SECONDS: ${DEBUG_TRACE_LIFETIME_SECONDS:-3600}
      DEBUG_TRACE_RATE: ${DEBUG_TRACE_RATE:-60/min}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      # One proxy in this stack -- nginx in the frontend container -- where a
      # deployed environment has two. See .env.sample.
      NUM_PROXIES: ${NUM_PROXIES:-1}
      APPEND_BURST_RATE: ${APPEND_BURST_RATE:-20/min}
      APPEND_SUSTAINED_RATE: ${APPEND_SUSTAINED_RATE:-300/hour}
      CLIENT_REPORT_RATE: ${CLIENT_REPORT_RATE:-30/min}
      LABEL_BASE_URL: ${LABEL_BASE_URL:-https://inventory.nycmesh.net}
      DATABASE_URL: postgres://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD:-inventory}@postgres:5432/${POSTGRES_DB:-inventory_tng}
      # Sign-in providers, all optional and all empty by default: a provider
      # whose pair is absent is simply not offered, so this stack comes up
      # with the local password path of
      # docs/decisions/0013-administrator-sign-in.md and nothing else. Fill
      # any of them in .env to try one against a real provider locally.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SERVER_URL: ${OIDC_SERVER_URL:-}
      OIDC_NAME: ${OIDC_NAME:-Single sign-on}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-oidc}
    ports:
      - "8000:8000"
    # Migrations run here for convenience in local dev only. In Kubernetes they
    # run as a separate Job so replicas cannot race -- see docs/deployment.md.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn inventory_tng.wsgi:application -c gunicorn.conf.py --bind 0.0.0.0:8000 --access-logfile -"

  # Somewhere for telemetry to go, and the worked example of what a cluster
  # needs. Not started by `compose up`: it is behind a profile, so a developer
  # who has not asked for telemetry pays for nothing and DEVELOPERS.md's
  # getting-started does not grow a step.
  #
  #   podman compose --profile telemetry up -d
  #
  # docs/observability.md is what to open, what it proves, and why this image.
  collector:
    profiles: [telemetry]
    image: docker.io/grafana/otel-lgtm:0.31.0
    # Two of the three restraints above, and not the third. This is somebody
    # else's bundle of five servers, each of which writes to a directory of its
    # own inside the image, so a read-only root would be a list of tmpfs mounts
    # to keep in step with a release nobody here controls. Dropping privileges
    # and capabilities costs nothing and is kept; the root filesystem is not,
    # and this is the only service in this file that may say that. It is off by
    # default and never deployed, which is what makes the trade payable.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Grafana, which is what a person opens.
      - "3000:3000"
      # OTLP in, gRPC and HTTP. The backend uses the HTTP one; the other is
      # published so that a browser or another service can be pointed here
      # without editing this file.
      - "4317:4317"
      - "4318:4318"
    environment:
      # Grafana asks for a password otherwise, and there is nothing behind this
      # but a laptop's own telemetry. Named here rather than left to the
      # image's default so that it is a decision somebody can see.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      # Named, so that what was captured survives `compose down` and can be
      # looked at again. `compose down -v` is how to forget it.
      - collector_data:/data

  frontend:
    build:
      context: ./frontend
    <<: *hardened
    # nginx-unprivileged's own uid. It listens on 8080 rather than 80, so not
    # even NET_BIND_SERVICE is missed from what is dropped above.
    user: "101:101"
    tmpfs:
      # Three places and no more: the rendered configuration, because the base
      # image runs the template through envsubst at startup; the temporary
      # paths a request body too large to hold in memory is spooled through;
      # and the temporary directory, where this image keeps its pid file
      # because /run is not writable to the account it runs as.
      - /etc/nginx/conf.d:mode=1777
      - /var/cache/nginx:mode=1777
      - /tmp:mode=1777
    depends_on:
      - backend
    environment:
      BACKEND_ORIGIN: http://backend:8000
      # Where the browser's spans go, when somebody has a debug token and the
      # collector profile is up. Set alongside OTEL_EXPORTER_OTLP_ENDPOINT by
      # the command in docs/observability.md, on the command line for the same
      # reason that one is.
      #
      # NOT DEFAULTED TO `collector`, which is what shipped and what stopped
      # this stack serving anything at all. nginx resolves a `proxy_pass` host
      # once, at startup, and refuses to start when it does not resolve -- so
      # naming a service that exists only under the `telemetry` profile killed
      # the frontend container of the ordinary quickstart with `host not found
      # in upstream`. frontend/Dockerfile defaults to this discard address and
      # says why; there is nothing for compose to improve on.
      COLLECTOR_ORIGIN: ${COLLECTOR_ORIGIN:-http://127.0.0.1:9}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  collector_data:
