# Development only; production runs on Kubernetes with Helm.
# Run it with `mise run compose -- <arguments>`, which picks Podman or Docker.
name: inventory-tng

services:
  db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      # Why 5433, and how to change it: CONTRIBUTING.md.
      - "127.0.0.1:${INVENTORY_DB_PORT:-5433}:5432"
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      # -h, so it asks over TCP: on first start the image runs a setup server
      # on the socket only, and that one must not count. -U and -d only stop
      # each probe logging an error about a role that does not exist.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "inventory", "-d", "inventory"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The backend in a container (CONTRIBUTING.md, Running the app in a container).
  app:
    build:
      # The root, so the image can build frontend/ as well.
      context: .
      dockerfile: backend/Containerfile
    # Migrate, then serve with reload. A reload does not migrate again.
    command:
      - sh
      - -c
      - alembic upgrade head && exec python -m inventory_tng --host 0.0.0.0 --reload
    # An init process as PID 1, to pass on signals and reap the reloader's
    # children.
    init: true
    # A terminal, so the logs keep their colour.
    tty: true
    # Every setting it takes, and only those (CONTRIBUTING.md, Running the app
    # in a container): each from your shell or .env, unset if neither sets
    # it.
    environment:
      APP_ENV:
      UNMASK_SECRETS:
      LOG_LEVEL:
      LOG_LEVELS:
      LOG_FORMAT:
      LOG_CLIENT_ADDRESS:
      # The health check runs every 5 s: at debug, unless .env says otherwise.
      LOG_HEALTH_CHECKS: ${LOG_HEALTH_CHECKS:-false}
      SETUP_TOKEN:
      RECOVERY_TOKEN:
      MAIL_PORT:
      MAIL_SECURITY:
      MAIL_FROM:
      MAIL_USERNAME:
      MAIL_PASSWORD:
      SITE_URL:
      OTEL_SDK_DISABLED:
      OTEL_SERVICE_NAME:
      OTEL_RESOURCE_ATTRIBUTES:
      OTEL_TRACES_SAMPLER:
      OTEL_TRACES_SAMPLER_ARG:
      OTEL_TRACES_EXPORTER:
      OTEL_METRICS_EXPORTER:
      OTEL_LOGS_EXPORTER:
      OTEL_METRIC_EXPORT_INTERVAL:
      OTEL_BSP_SCHEDULE_DELAY:
      OTEL_BLRP_SCHEDULE_DELAY:
      # Its own, where .env's would name localhost, which inside the
      # container is the container.
      DATABASE_URL: postgresql://inventory:inventory@db:5432/inventory
      OTEL_EXPORTER_OTLP_ENDPOINT: ${INVENTORY_APP_OTLP_ENDPOINT:-}
      # Mailpit, when .env sends mail to it on localhost.
      MAIL_HOST: ${INVENTORY_APP_MAIL_HOST:-}
      # The bundle it built, as production serves it.
      VITE_DEV_SERVER: ""
      FRONTEND_DIST: /app/static
    # Read-only bind mounts, so --reload sees your edits and nothing in the
    # container can change them. :z relabels them for SELinux.
    volumes:
      - ./backend/src:/app/src:ro,z
      - ./backend/migrations:/app/migrations:ro,z
    ports:
      - "127.0.0.1:${INVENTORY_APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Here, not in the Containerfile: podman build drops HEALTHCHECK. Every
    # 5 s, so --wait returns soon: Podman ignores start_interval.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3).status != 200)"
      interval: 5s
      start_period: 30s

  # Optional: `mise run compose -- --profile telemetry up -d dashboard`, then
  # http://localhost:18888. It receives OTLP on localhost:4318.
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.2
    profiles: [telemetry]
    environment:
      # Local only, so no login.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4318:18890"

  # Optional: `mise run compose -- --profile mail up -d mail`, then
  # http://localhost:8025. It catches mail sent to localhost:1025, and sends
  # nothing on (CONTRIBUTING.md, Mail).
  mail:
    image: docker.io/axllent/mailpit:v1.31.6
    profiles: [mail]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # Optional: `mise run phone` (CONTRIBUTING.md, On a phone). In the app's
  # network, so it reaches the app from 127.0.0.1, which uvicorn trusts by
  # default: links say https and the tunnel's host, and the client address
  # is the one Cloudflare saw, not one a client wrote in X-Forwarded-For.
  tunnel:
    image: docker.io/cloudflare/cloudflared:2026.10.7
    profiles: [phone]
    command: [tunnel, --no-autoupdate, --url, "http://localhost:8000"]
    network_mode: service:app
    depends_on:
      app:
        condition: service_healthy

volumes:
  db:
