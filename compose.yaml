# Development only; production runs on Kubernetes with Helm.
# Run it with `mise run compose -- <arguments>`, which picks Podman or Docker.
name: inventory-tng

services:
  db:
    image: docker.io/library/postgres:18
    # Podman's exec bug: without this, rootless Podman's health checks and
    # exec fail under crun 1.31 and later (CONTRIBUTING.md, Podman's exec bug;
    # https://github.com/podman-container-tools/podman/issues/30245).
    oom_score_adj: 200
    # Room for a few checkouts' test runs, apps and browser tests at once
    # (CONTRIBUTING.md, Connections); 100 is the default. An idle connection
    # costs a few MB, so slots are cheap. Every checkout shares this
    # container, so the tasks never make it again (`mise run
    # start-database`): a change here takes effect with `mise run
    # recreate-database-container`, which keeps the volume but ends every
    # checkout's connections.
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      # The superuser, which only makes the owner and app roles, the tests'
      # databases and each checkout's (dev_database.py): the app and
      # migrations never log in as it.
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      # Why 5433, and how to change it: CONTRIBUTING.md.
      - "127.0.0.1:${INVENTORY_DB_PORT:-5433}:5432"
    volumes:
      # Only the named volume: a bind mount would put this checkout's path in
      # the settings start-database compares, so another checkout's would
      # differ. So the roles come from dev_database.py, not an init script.
      - db:/var/lib/postgresql
    healthcheck:
      # -h, so it asks over TCP: on first start the image runs a setup server
      # on the socket only, and that one must not count. -U and -d only stop
      # each probe logging an error about a role that does not exist.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "inventory", "-d", "inventory"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The backend in a container (CONTRIBUTING.md, Running the app in a container).
  app:
    build:
      # The root, so the image can build frontend/ as well.
      context: .
      dockerfile: backend/Containerfile
    # Podman's exec bug: without this, rootless Podman's health checks and
    # exec fail under crun 1.31 and later (CONTRIBUTING.md, Podman's exec bug;
    # https://github.com/podman-container-tools/podman/issues/30245).
    oom_score_adj: 200
    # Migrate, then serve with reload. A reload does not migrate again.
    command:
      - sh
      - -c
      - alembic upgrade head && exec python -m inventory_tng --host 0.0.0.0 --reload
    # An init process as PID 1, to pass on signals and reap the reloader's
    # children.
    init: true
    # A terminal, so the logs keep their colour.
    tty: true
    # The settings .env.example names, and only those (CONTRIBUTING.md,
    # Running the app in a container): each from your shell or .env, unset if
    # neither sets it. Not a signal's own OTLP endpoint, which would name
    # localhost, as OTEL_EXPORTER_OTLP_ENDPOINT would.
    environment:
      APP_ENV:
      UNMASK_SECRETS:
      LOG_LEVEL:
      LOG_LEVELS:
      LOG_FORMAT:
      LOG_CLIENT_ADDRESS:
      # The health check runs every 5 s: at debug, unless .env says otherwise.
      LOG_HEALTH_CHECKS: ${LOG_HEALTH_CHECKS:-false}
      SETUP_TOKEN:
      RECOVERY_TOKEN:
      MAIL_PORT:
      MAIL_SECURITY:
      MAIL_FROM:
      MAIL_USERNAME:
      MAIL_PASSWORD:
      SITE_URL:
      FORWARDED_ALLOW_IPS:
      LOG_REDACTION:
      LOG_REDACTION_OFF_UNTIL:
      TRACE_REDACTION:
      TRACE_REDACTION_OFF_UNTIL:
      REDACTION_OFF_MAX_HOURS:
      OTEL_SDK_DISABLED:
      OTEL_SERVICE_NAME:
      OTEL_RESOURCE_ATTRIBUTES:
      OTEL_TRACES_SAMPLER:
      OTEL_TRACES_SAMPLER_ARG:
      OTEL_TRACES_EXPORTER:
      OTEL_METRICS_EXPORTER:
      OTEL_LOGS_EXPORTER:
      OTEL_METRIC_EXPORT_INTERVAL:
      OTEL_BSP_SCHEDULE_DELAY:
      OTEL_BLRP_SCHEDULE_DELAY:
      # Its own, where .env's would name localhost, which inside the
      # container is the container. It migrates as the owner, and serves as
      # the app.
      # This checkout's database (.env's INVENTORY_DB_NAME), made by `mise
      # run dev-database`.
      DATABASE_URL: postgresql://inventory_app:inventory_app@db:5432/${INVENTORY_DB_NAME:-inventory}
      MIGRATION_DATABASE_URL: postgresql://inventory_owner:inventory_owner@db:5432/${INVENTORY_DB_NAME:-inventory}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${INVENTORY_APP_OTLP_ENDPOINT:-}
      # Mailpit, when .env sends mail to it on localhost.
      MAIL_HOST: ${INVENTORY_APP_MAIL_HOST:-}
      # The bundle it built, as production serves it.
      VITE_DEV_SERVER: ""
      FRONTEND_DIST: /app/static
      # .local/totp-keys, mounted below.
      TOTP_KEYS_DIR: /run/secrets/totp-keys
    # Read-only bind mounts, so --reload sees your edits and nothing in the
    # container can change them. :z relabels them for SELinux.
    volumes:
      - ./backend/src:/app/src:ro,z
      - ./backend/migrations:/app/migrations:ro,z
      - ./.local/totp-keys:/run/secrets/totp-keys:ro,z
    ports:
      - "127.0.0.1:${INVENTORY_APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Here, not in the Containerfile: podman build drops HEALTHCHECK. Every
    # 5 s, so --wait returns soon: Podman ignores start_interval.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3).status != 200)"
      interval: 5s
      start_period: 30s

  # Optional: `mise run compose -- --profile telemetry up -d dashboard`, then
  # http://localhost:18888. It receives OTLP on localhost:4318.
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.2
    profiles: [telemetry]
    environment:
      # Local only, so no login.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4318:18890"

  # Optional: `mise run browser-webkit` (CONTRIBUTING.md, Running the checks).
  # Playwright's own image and server, for WebKit where Playwright's WebKit
  # does not run on the host. Its version is frontend/package-lock.json's
  # @playwright/test, here twice, which a test keeps the same. The browser
  # reaches the app on the host through the tests' connection
  # (playwright.config.ts, exposeNetwork).
  webkit:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [webkit]
    # Podman's exec bug: without this, rootless Podman's health checks and
    # exec fail under crun 1.31 and later (CONTRIBUTING.md, Podman's exec bug;
    # https://github.com/podman-container-tools/podman/issues/30245).
    oom_score_adj: 200
    command: [npx, -y, playwright@1.64.1, run-server, --port, "3000", --host, "0.0.0.0"]
    init: true
    ipc: host
    ports:
      - "127.0.0.1:${INVENTORY_WEBKIT_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(3000).on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 2s
      # The first start fetches Playwright's package.
      start_period: 120s

  # Optional: `mise run compose -- --profile mail up -d mail`, then
  # http://localhost:8025. It catches mail sent to localhost:1025, and sends
  # nothing on (CONTRIBUTING.md, Mail).
  mail:
    image: docker.io/axllent/mailpit:v1.31.6
    profiles: [mail]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # Optional: `mise run phone` (CONTRIBUTING.md, On a phone). In the app's
  # network, so it reaches the app from 127.0.0.1, which uvicorn trusts by
  # default: links say https and the tunnel's host, and the client address
  # is the one Cloudflare saw, not one a client wrote in X-Forwarded-For.
  tunnel:
    image: docker.io/cloudflare/cloudflared:2026.10.7
    profiles: [phone]
    command: [tunnel, --no-autoupdate, --url, "http://localhost:8000"]
    network_mode: service:app
    depends_on:
      app:
        condition: service_healthy

volumes:
  db:
