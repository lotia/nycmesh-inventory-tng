{% extends "admin_base.html" %}
{% block main %}
<section>
  <h2>Scan page</h2>
  <form method="post" action="{{ request.url.path }}/scan">
    <label>Ask whose name it is after <span class="hint">minutes a phone sits unused; 0 never asks</span>
      <input name="name_check_minutes" type="number" min="0" max="{{ name_check_max }}" value="{{ name_check_minutes }}" required>
      {% with name = "name_check_minutes" %}{% include "_field_problem.html" %}{% endwith %}
    </label>
    <button>Save</button>
  </form>
  <p class="hint">After that long, the page asks "Are you …?" before the next
  save, so a shared phone isn't used under someone else's name.</p>
</section>
{% endblock %}
