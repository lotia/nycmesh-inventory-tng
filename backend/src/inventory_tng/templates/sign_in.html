{% extends "admin_base.html" %}
{% block main %}
<form method="post" action="{{ paths.sign_in }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Username
    <input name="username" value="{{ username }}" autocomplete="username" required autofocus>
  </label>
  <label>Password
    <input name="password" type="password" autocomplete="current-password" required>
  </label>
  <label>Code <span class="hint">from your authenticator, or a recovery code; leave blank if you don't use one</span>
    <input name="code" autocomplete="one-time-code" maxlength="16">
  </label>
  <button>Sign in</button>
</form>
{% endblock %}
