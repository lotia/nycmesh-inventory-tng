openapi: 3.1.1
info:
  title: NYC Mesh Inventory API
  version: 0.1.0
  description: Inventory tracking for NYC Mesh. See docs/architecture.md.
paths:
  /api:
    get:
      operationId: root_retrieve
      description: |-
        Where this API starts.

        Exists so a client does not have to know the URL layout in advance: fetch
        this, and every collection is a link. What each one accepts, and the
        endpoints addressed per row, are in the schema this also links to --
        the index says where things are, the schema says what they take.

        Fetching it also hands the browser a CSRF token. Session authentication
        enforces CSRF on every write, and a single-page app never renders a Django
        template, so without this nothing would set the cookie and no browser
        could post anything. The index is the right place for it: it is what a
        client fetches first, and it is public, so the token is available before
        anyone has logged in.
      summary: List the API's entry points
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
          description: ''
  /api/categories:
    get:
      operationId: categories_list
      description: The item groupings, for narrowing the catalogue.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    post:
      operationId: categories_create
      description: |-
        The item groupings, for narrowing the catalogue.

        Requires an administrator. See docs/decisions/0012-two-populations.md for who that is and why.
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/categories/{id}:
    get:
      operationId: categories_retrieve
      description: |-
        One grouping, read by anyone and renamed or re-parented by an administrator.

        A category carries no ``active`` column, so nothing here is withdrawn from
        the list and both querysets are the same one. Adding such a column would
        be guessing at inventory-tng-6c7's answer, and an unwanted grouping with
        no items in it is already reachable through the Django admin, which
        decision 0014 point 4 keeps for exactly this.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    patch:
      operationId: categories_partial_update
      description: |-
        One grouping, read by anyone and renamed or re-parented by an administrator.

        A category carries no ``active`` column, so nothing here is withdrawn from
        the list and both querysets are the same one. Adding such a column would
        be guessing at inventory-tng-6c7's answer, and an unwanted grouping with
        no items in it is already reachable through the Django admin, which
        decision 0014 point 4 keeps for exactly this.

        Requires an administrator. See docs/decisions/0012-two-populations.md for who that is and why.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/healthz:
    get:
      operationId: healthz_retrieve
      description: |-
        Liveness and readiness probe used by Kubernetes.

        Issues a trivial query so the check fails when the database is
        unreachable, rather than reporting healthy while unable to serve.
        See docs/deployment.md.
      summary: Liveness and readiness probe
      tags:
      - healthz
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
          description: ''
  /api/items:
    get:
      operationId: items_list
      description: |-
        The catalogue, with the stock behind it. Administrators add to it.

        This is the screen the volunteer mockup is almost entirely made of: every
        item, its count, and a way to add some to the cart. See decision 0011.

        Creating one is an administrator's operation (decision 0014 point 2), so
        the two audiences meet on one endpoint and ``StaffWrites`` is what
        separates them.
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Name contains
      tags:
      - items
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedItemList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    post:
      operationId: items_create
      description: |-
        The catalogue, with the stock behind it. Administrators add to it.

        This is the screen the volunteer mockup is almost entirely made of: every
        item, its count, and a way to add some to the cart. See decision 0011.

        Creating one is an administrator's operation (decision 0014 point 2), so
        the two audiences meet on one endpoint and ``StaffWrites`` is what
        separates them.

        Requires an administrator. See docs/decisions/0012-two-populations.md for who that is and why.
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemDetail'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/items/{id}:
    get:
      operationId: items_retrieve
      description: |-
        One item, read by anyone and edited by an administrator.

        Retiring an item is a PATCH setting ``active`` to false, not a delete: the
        ledger refers to it for as long as the ledger exists, and what
        ``active=False`` should mean for stock still physically on a shelf is
        inventory-tng-6c7.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    patch:
      operationId: items_partial_update
      description: |-
        One item, read by anyone and edited by an administrator.

        Retiring an item is a PATCH setting ``active`` to false, not a delete: the
        ledger refers to it for as long as the ledger exists, and what
        ``active=False`` should mean for stock still physically on a shelf is
        inventory-tng-6c7.

        Requires an administrator. See docs/decisions/0012-two-populations.md for who that is and why.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedItemDetail'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/labels:
    get:
      operationId: labels_list
      description: |-
        Every label that still points at something.

        Unpaginated, deliberately. This exists to be fetched once and cached, so
        that a scan resolves without a round trip from a basement (decision 0011);
        handing it back in pages would make the client stitch them together for no
        benefit at a few hundred rows.
      tags:
      - labels
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabelMap'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    post:
      operationId: labels_create
      description: |-
        Every label that still points at something.

        Unpaginated, deliberately. This exists to be fetched once and cached, so
        that a scan resolves without a round trip from a basement (decision 0011);
        handing it back in pages would make the client stitch them together for no
        benefit at a few hundred rows.

        Requires an administrator. See docs/decisions/0012-two-populations.md for who that is and why.
      tags:
      - labels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Label'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/labels/{code}:
    get:
      operationId: labels_retrieve
      description: |-
        One label, found by the code printed on it.

        A revoked label resolves rather than 404s: the sticker is superseded, but
        it still says what it pointed at, and refusing the scan would block a
        volunteer over bookkeeping. The client is told, through ``revoked_at``,
        and can say so.

        Revoking is an administrator's operation (decision 0012) and happens here
        rather than at a URL of its own, because the code is the label's identity
        and a faded sticker is the complaint this project started with. It is a
        PATCH of ``revoked``, never a delete: the ledger's history refers to what
        the sticker pointed at.
      summary: Resolve a scanned label code
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - labels
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelResolve'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    patch:
      operationId: labels_partial_update
      description: |-
        One label, found by the code printed on it.

        A revoked label resolves rather than 404s: the sticker is superseded, but
        it still says what it pointed at, and refusing the scan would block a
        volunteer over bookkeeping. The client is told, through ``revoked_at``,
        and can say so.

        Revoking is an administrator's operation (decision 0012) and happens here
        rather than at a URL of its own, because the code is the label's identity
        and a faded sticker is the complaint this project started with. It is a
        PATCH of ``revoked``, never a delete: the ledger's history refers to what
        the sticker pointed at.

        Requires an administrator. See docs/decisions/0012-two-populations.md for who that is and why.
      summary: Revoke, restore or correct a label
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - labels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLabel'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/locations:
    get:
      operationId: locations_list
      description: |-
        Everywhere stock can be. A pick-list, like volunteers.

        Retired locations are not offered, and `active` is deliberately not a
        filter: the queryset already fixes it, so the parameter could only ever
        return nothing. Same shape as the volunteer pick-list, which narrows on a
        queryset rather than advertising `active` either.
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - hub
          - room
          - shelf
          - vehicle
          - volunteer_custody
          - warehouse
        description: |-
          * `warehouse` - Warehouse
          * `hub` - Hub
          * `room` - Room
          * `shelf` - Shelf
          * `volunteer_custody` - Volunteer custody
          * `vehicle` - Vehicle
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
      tags:
      - locations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    post:
      operationId: locations_create
      description: |-
        Everywhere stock can be. A pick-list, like volunteers.

        Retired locations are not offered, and `active` is deliberately not a
        filter: the queryset already fixes it, so the parameter could only ever
        return nothing. Same shape as the volunteer pick-list, which narrows on a
        queryset rather than advertising `active` either.

        Requires an administrator. See docs/decisions/0012-two-populations.md for who that is and why.
      tags:
      - locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/locations/{id}:
    get:
      operationId: locations_retrieve
      description: |-
        One location, read by anyone and edited by an administrator.

        Retiring one is a PATCH setting ``active`` to false, for the reason given
        on ItemDetailView: the ledger refers to it forever.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - locations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    patch:
      operationId: locations_partial_update
      description: |-
        One location, read by anyone and edited by an administrator.

        Retiring one is a PATCH setting ``active`` to false, for the reason given
        on ItemDetailView: the ledger refers to it forever.

        Requires an administrator. See docs/decisions/0012-two-populations.md for who that is and why.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLocation'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/me:
    get:
      operationId: me_retrieve
      description: |-
        Who the caller is, and what this server will let them do.

        Decision 0014 point 3: the interface renders administrative controls from
        this answer rather than guessing at them.

        Deliberately public, and deliberately not a 403 for a caller with no
        session. The volunteer app fetches this on load, and decision 0012 says a
        volunteer never signs in -- so "you are nobody, and here is what nobody may
        do" is the ordinary case, not an error to be handled on the way to the
        real one.
      summary: What the caller is and what they may do
      tags:
      - me
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/stock/transactions:
    post:
      operationId: stock_transactions_create
      description: |-
        Record one batch: one transaction, one movement per line, one commit.

        This is the endpoint the project exists for. The system it replaces could
        carry one item per form submission, so people submitted the same form over
        and over; here that is one request. See
        docs/decisions/0011-qr-batch-scanning.md.
      summary: Record a batch of stock movements
      tags:
      - stock
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockTransactionCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransaction'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransaction'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRejected'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchInconsistent'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/volunteers:
    get:
      operationId: volunteers_list
      description: |-
        The volunteer pick-list, and the way onto it.

        Volunteers are a pick-list with no password (decision 0008 point 5). The
        client searches this before offering to add anyone, which is what stops a
        second generation of the duplicate spellings that decision counts.

        The one place the two halves disagree is an identifier held by somebody the
        list does not offer, which is answered with a 409 naming them rather than a
        400 the volunteer cannot act on. See decision 0015.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Fuzzy name search
      tags:
      - volunteers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVolunteerList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    post:
      operationId: volunteers_create
      description: |-
        The volunteer pick-list, and the way onto it.

        Volunteers are a pick-list with no password (decision 0008 point 5). The
        client searches this before offering to add anyone, which is what stops a
        second generation of the duplicate spellings that decision counts.

        The one place the two halves disagree is an identifier held by somebody the
        list does not offer, which is answered with a 409 naming them rather than a
        400 the volunteer cannot act on. See decision 0015.
      summary: Add a volunteer to the pick-list
      tags:
      - volunteers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Volunteer'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volunteer'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerConflict'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Throttled'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/volunteers/{id}:
    get:
      operationId: volunteers_retrieve
      description: |-
        One volunteer, read by anyone and repaired by an administrator.

        Merging duplicates and retiring a record are the operations decision 0012
        reserves for somebody signed in, and they happen here rather than at a URL
        of their own: a merge is an edit to the duplicate, saying who it turned out
        to be. There is no delete, because the ledger attributes work to this row
        for as long as the ledger exists.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - volunteers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    patch:
      operationId: volunteers_partial_update
      description: |-
        One volunteer, read by anyone and repaired by an administrator.

        Merging duplicates and retiring a record are the operations decision 0012
        reserves for somebody signed in, and they happen here rather than at a URL
        of their own: a merge is an edit to the duplicate, saying who it turned out
        to be. There is no delete, because the ledger attributes work to this row
        for as long as the ledger exists.

        Requires an administrator. See docs/decisions/0012-two-populations.md for who that is and why.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - volunteers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVolunteerDetail'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
components:
  schemas:
    ApiError:
      type: object
      description: |-
        One thing wrong, and where.

        ``index`` is the position in the submitted ``movements`` array, or null
        when the problem is with the batch itself rather than one of its lines.
      properties:
        index:
          type:
          - integer
          - 'null'
        field:
          type: string
        detail:
          type: string
      required:
      - detail
      - field
      - index
    ApiRoot:
      type: object
      properties:
        health:
