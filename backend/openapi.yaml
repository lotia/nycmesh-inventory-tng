    StockTransaction:
      type: object
      description: |-
        A recorded batch, as it is read back.

        Renders a response the view has assembled rather than a bare model: both
        ``lines`` and ``warnings`` are attributes the view attaches, so the rows
        are read once and the balances behind the warnings once.
      properties:
        id:
          type: integer
          readOnly: true
        idempotency_key:
          type:
          - string
          - 'null'
          maxLength: 64
        kind:
          $ref: '#/components/schemas/TransactionKindEnum'
        actor:
          type: integer
        occurred_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
          readOnly: true
        reason:
          type: string
          maxLength: 100
        job_reference:
          type: string
          description: Install or node this relates to, e.g. NN217.
          maxLength: 50
        note:
          type: string
        movements:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
          readOnly: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/StockTransactionWarning'
          readOnly: true
      required:
      - actor
      - id
      - kind
      - movements
      - recorded_at
      - warnings
    StockTransactionCreate:
      type: object
      description: |-
        A batch as it is submitted: one act, many lines.

        Movements name items by id, never by label code. The client has already
        resolved every code it scanned, and accepting codes here would add a second
        resolution path that fails after the volunteer thinks they are done.
      properties:
        idempotency_key:
          type:
          - string
          - 'null'
          maxLength: 64
        kind:
          $ref: '#/components/schemas/TransactionKindEnum'
        actor:
          type: integer
        occurred_at:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 100
        job_reference:
          type: string
          description: Install or node this relates to, e.g. NN217.
          maxLength: 50
        note:
          type: string
        movements:
          type: array
          items:
            $ref: '#/components/schemas/StockMovementInput'
      required:
      - actor
      - kind
      - movements
    StockTransactionWarning:
      type: object
      description: |-
        Stock went negative. The movement was recorded anyway; see decision
        0011, "Insufficient stock is a warning, not a rejection".
      properties:
        item:
          type: integer
        location:
          type: integer
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        detail:
          type: string
      required:
      - balance
      - detail
      - item
      - location
    Throttled:
      type: object
      description: |-
        Too many submissions, too fast. Nothing was recorded; send it again later.

        ``code`` is constant, so a client branches on it instead of on the prose,
        and ``retry_after_seconds`` is the same number as the Retry-After header,
        so a countdown can be rendered rather than a sentence read.
      properties:
        detail:
          type: string
        code:
          type: string
        retry_after_seconds:
          type: integer
      required:
      - code
      - detail
      - retry_after_seconds
