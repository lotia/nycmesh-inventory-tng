        email:
          oneOf:
          - type:
            - string
            - 'null'
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        slack_id:
          type:
          - string
          - 'null'
          maxLength: 50
        active:
          type: boolean
        merged_into:
          type:
          - integer
          - 'null'
          description: Set when this record is a duplicate of another volunteer.
    StockMovement:
      type: object
      description: One recorded line, as it is read back.
      properties:
