components:
  schemas:
    ApiError:
      type: object
      description: |-
        One thing wrong, and where.

        ``index`` is the position in the submitted ``movements`` array, or null
        when the problem is with the batch itself rather than one of its lines.
      properties:
        index:
          type:
          - integer
          - 'null'
        field:
          type: string
        detail:
          type: string
      required:
      - detail
      - field
      - index
    ApiRoot:
      type: object
      properties:
        health:
          type: string
          format: uri
        volunteers:
          type: string
          format: uri
        items:
          type: string
          format: uri
        locations:
          type: string
          format: uri
        categories:
          type: string
          format: uri
        labels:
          type: string
          format: uri
        stock:
          type: string
          format: uri
        me:
          type: string
          format: uri
        schema:
          type: string
          format: uri
        docs:
          type: string
          format: uri
      required:
      - categories
      - docs
      - health
      - items
      - labels
      - locations
      - me
      - schema
      - stock
      - volunteers
    BatchInconsistency:
      type: object
      description: One line that disagrees with the batch's declared kind.
      properties:
        index:
          type: integer
        detail:
          type: string
      required:
      - detail
      - index
    BatchInconsistent:
      type: object
      description: Every line is valid on its own, but they do not add up to the kind
        claimed.
      properties:
        detail:
          type: string
        kind:
          type: string
        inconsistent:
          type: array
          items:
            $ref: '#/components/schemas/BatchInconsistency'
      required:
      - detail
      - inconsistent
      - kind
    BatchRejected:
      type: object
      description: Nothing was saved. Every bad line is listed, so one pass fixes
        them all.
      properties:
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
      required:
      - detail
      - errors
    Capabilities:
      type: object
      properties:
        append_stock:
          type: boolean
        add_volunteer:
          type: boolean
        edit_catalogue:
          type: boolean
        print_label:
          type: boolean
        revoke_label:
          type: boolean
        merge_volunteers:
          type: boolean
      required:
      - add_volunteer
      - append_stock
      - edit_catalogue
      - merge_volunteers
      - print_label
      - revoke_label
    Category:
      type: object
      description: A grouping of items, nestable.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        parent:
          type:
          - integer
          - 'null'
      required:
      - id
      - name
    ClientFailure:
      type: object
      description: |-
        One failure a volunteer's browser could not handle.

        Deliberately three fields and no more: no URL, no user agent, no volunteer,
        no element. Decision 0012 argues why this endpoint exists at all and why
        its shape is a list rather than whatever a client sends.

        `detail` is free text and is the one thing here no list can police -- the
        same boundary the module above draws around a log message. It is bounded
        in length and the endpoint is rate limited; beyond that it is what somebody
        wrote in a `throw`.
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/ClientFailureKindEnum'
          description: |-
            What kind of failure this is: one of the browser's two handlers, or one this app reports itself.

            * `window.onerror` - window.onerror
            * `unhandledrejection` - unhandledrejection
            * `decode-loop` - decode-loop
            * `refused` - refused
            * `server-error` - server-error
        where:
          allOf:
          - $ref: '#/components/schemas/WhereEnum'
          description: |-
            What the app was doing, in this app's own words -- `scan`, `outbox`, `print`.

            * `scan` - scan
            * `outbox` - outbox
            * `print` - print
            * `api` - api
            * `app` - app
        detail:
          type: string
          description: The message, and the stack where the browser gave one.
          maxLength: 2000
      required:
      - detail
      - kind
      - where
    ClientFailureKindEnum:
      enum:
      - window.onerror
      - unhandledrejection
      - decode-loop
      - refused
      - server-error
      type: string
      description: |-
        * `window.onerror` - window.onerror
        * `unhandledrejection` - unhandledrejection
        * `decode-loop` - decode-loop
        * `refused` - refused
        * `server-error` - server-error
    CodeEnum:
      enum:
      - volunteer_merged
      - volunteer_inactive
      type: string
      description: |-
        * `volunteer_merged` - volunteer_merged
        * `volunteer_inactive` - volunteer_inactive
    CurrentUser:
      type: object
      properties:
        authenticated:
          type: boolean
        username:
          type:
          - string
          - 'null'
        administrator:
          type: boolean
        recently_authenticated:
          type: boolean
        enrolment:
          $ref: '#/components/schemas/EnrolmentEnum'
        search_minimum:
          type: integer
        capabilities:
          $ref: '#/components/schemas/Capabilities'
      required:
      - administrator
      - authenticated
      - capabilities
      - enrolment
      - recently_authenticated
      - search_minimum
      - username
    Detail:
      type: object
      description: |-
        A refusal, said in a typed body so a client can render it.

        One shape for every refusal DRF renders as a bare sentence -- nothing here,
        and not for you. Two identical components would drift the moment either
        grew a machine-readable ``code``, which is the shape ThrottledSerializer
        already uses and decision 0015 argues for.

        A volunteer reaching an administrator's operation is told so rather than
        shown nothing (decision 0014 point 2), so the refusal is part of the
        contract and is described like any other response.

        ``code`` is the branch a client actually takes, and it is optional because
        only the 403 carries one: ``forbidden`` and ``reauthentication_required``
        share that status and mean opposite things (decision 0014 point 5).
        Nothing here is missing on a 404, where the sentence is the whole answer.
        The values are attached by ``exception_handler`` in inventory/api.py, whose
        comment says what each of the two asks a client to draw.
      properties:
        detail:
          type: string
        code:
          type: string
          description: '`forbidden`, or `reauthentication_required` when signing in
            again is what fixes it.'
      required:
      - detail
    DeviceCredential:
      type: object
      description: |-
        The token an enrolled device stores and presents. Provisional.

        Answered once, at enrolment, and never readable again: there is no endpoint
        that hands an existing device its token back, because the only copy is the
        one the browser stored. Losing it is enrolling again, which is exactly the
        cost the demo's fifth act exists to show.
      properties:
        token:
          type: string
          description: Send this back in the X-Device header on every request.
      required:
      - token
    DeviceEnrolment:
      type: object
      description: |-
        What a browser sends to enrol. Provisional; see `DeviceEnrolmentView`.

        One optional field, and it is optional in the serializer rather than in the
        posture: under ``enrolled_self`` there is nothing to send, and under
        ``enrolled_code`` a missing code and a wrong one are refused identically,
        so making it required here would produce two different refusals for the
        same fact. The view is where that is decided.
      properties:
        code:
          type: string
          description: The enrolment code this deployment was given, where VOLUNTEER_ACCESS=enrolled_code.
          maxLength: 100
    EnrolmentEnum:
      enum:
      - not_required
      - enrolled
      - self
      - code
      type: string
      description: |-
        * `not_required` - not_required
        * `enrolled` - enrolled
        * `self` - self
        * `code` - code
    FieldEnum:
      enum:
      - email
      - slack_id
      type: string
      description: |-
        * `email` - email
        * `slack_id` - slack_id
    HealthCheck:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Item:
      type: object
      description: |-
        A catalogue entry with the stock behind it.

        Balances and labels are attached by the view in bulk. Reading them per
        item would be two queries per row on the screen the volunteer looks at
        most.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        category:
          type: integer
        unit_of_measure:
          $ref: '#/components/schemas/UnitOfMeasureEnum'
        minimum_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        reorder_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        active:
          type: boolean
        balances:
          type: array
          items:
            $ref: '#/components/schemas/ItemBalance'
          readOnly: true
        labels:
          type: array
          items:
            $ref: '#/components/schemas/ItemLabel'
          readOnly: true
      required:
      - balances
      - category
      - id
      - labels
      - name
    ItemBalance:
      type: object
      description: How much of one item is at one location, derived from the ledger.
      properties:
        location:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
      required:
      - location
      - quantity
    ItemDetail:
      type: object
      description: |-
        One catalogue entry, as an administrator reads and edits it.

        Adds the two fields the list deliberately leaves out. ``description`` is
        free text and ``attributes`` is a specification blob; the item list is a
        hundred rows fetched over a phone connection (see ItemListView), so
        carrying either there would pay for them a hundred times over to render
        neither.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        category:
          type: integer
        unit_of_measure:
          $ref: '#/components/schemas/UnitOfMeasureEnum'
        minimum_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        reorder_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        active:
          type: boolean
        balances:
          type: array
          items:
            $ref: '#/components/schemas/ItemBalance'
          readOnly: true
        labels:
          type: array
          items:
            $ref: '#/components/schemas/ItemLabel'
          readOnly: true
        description:
          type: string
        attributes:
          description: Type-specific specifications. Radios, cable and hand tools
            have little in common.
      required:
      - balances
      - category
      - id
      - labels
      - name
    ItemLabel:
      type: object
      description: |-
        An active label on this item, and what one scan of it means.

        The distinct quantities across an item's labels *are* its packaging, and
        are what the list offers as one-tap chips. See decision 0011 section 5.
      properties:
        code:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
      required:
      - code
      - quantity
    Label:
      type: object
      description: |-
        A label as an administrator prints and revokes it.

        ``code`` is read-only in both directions of a write: it is minted here,
        from ``Label.mint_unique_code``, and printing is the one moment it is
        decided. A client that could choose one could choose a code outside the
        alphabet the resolver's folding depends on, or one already on a sticker
        somewhere -- and a client that could change one would 404 a sticker
        already out on a shelf.

        ``revoked`` is a boolean rather than a writable ``revoked_at`` because the
        server owns the clock: a client that could name the moment could revoke a
        sticker in the future, and a sticker is either honoured or it is not.
        Setting it back to false un-revokes, so revoking the wrong label is undone
        rather than worked around with a reprint.
      properties:
        code:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/LabelKindEnum'
          readOnly: true
        quantity:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          description: 'How much of the item one scan of this label stands for: a
            packet of 100 zip ties is 100. Null on a location label, which stands
            for no quantity of anything.'
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        item:
          type:
          - integer
          - 'null'
        location:
          type:
          - integer
          - 'null'
        revoked:
          type: boolean
          writeOnly: true
          description: True revokes this label, false restores it. The timestamp is
            the server's.
      required:
      - code
      - kind
      - revoked_at
    LabelKindEnum:
      enum:
      - item
      - location
      type: string
      description: |-
        * `item` - item
        * `location` - location
    LabelMap:
      type: object
      description: |-
        One label in the map the client caches, and what a scan needs of it.

        Drops ``revoked_at``, which this queryset guarantees is null, a few
        hundred times over. See LabelListView for why this response's size is
        worth caring about.

        Carries the item's name and unit instead. A cart line needs both, and
        without them the client had to hold the whole catalogue as well -- which
        is paginated, so the prefetch became four round trips fetching eighty
        kilobytes of balances and labels to keep three fields per item, on the
        connection decision 0011 section 1 exists for. Forty bytes a row here
        replaces all of it with the one unpaginated GET this endpoint is for.
      properties:
        code:
          type: string
          maxLength: 32
        kind:
          allOf:
          - $ref: '#/components/schemas/LabelKindEnum'
          readOnly: true
        quantity:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          description: 'How much of the item one scan of this label stands for: a
            packet of 100 zip ties is 100. Null on a location label, which stands
            for no quantity of anything.'
        item:
          type:
          - integer
          - 'null'
        location:
          type:
          - integer
          - 'null'
        item_name:
          type: string
          readOnly: true
        unit_of_measure:
          type: string
          readOnly: true
      required:
      - code
      - item_name
      - kind
      - unit_of_measure
    LabelResolve:
      type: object
      description: |-
        What a scanned code points at.

        ``quantity`` is part of the contract, and decision 0011 section 6 says
        what the client cannot do without it.
      properties:
        code:
          type: string
          maxLength: 32
        kind:
          allOf:
          - $ref: '#/components/schemas/LabelKindEnum'
          readOnly: true
        quantity:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          description: 'How much of the item one scan of this label stands for: a
            packet of 100 zip ties is 100. Null on a location label, which stands
            for no quantity of anything.'
        revoked_at:
          type:
          - string
