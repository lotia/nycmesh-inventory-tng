      - checkin
      - receipt
      - consumption
      - transfer
      - adjustment
      - count
      type: string
      description: |-
        * `checkout` - Check out
        * `checkin` - Check in
        * `receipt` - Receipt
        * `consumption` - Used at a job
        * `transfer` - Transfer
        * `adjustment` - Adjustment
        * `count` - Stock count
