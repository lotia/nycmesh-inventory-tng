    PatchedCategory:
      type: object
      description: A grouping of items, nestable.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        parent:
          type:
          - integer
          - 'null'
    PatchedItemDetail:
      type: object
      description: |-
        One catalogue entry, as an administrator reads and edits it.

        Adds the two fields the list deliberately leaves out. ``description`` is
        free text and ``attributes`` is a specification blob; the item list is a
        hundred rows fetched over a phone connection (see ItemListView), so
        carrying either there would pay for them a hundred times over to render
        neither.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        category:
          type: integer
        unit_of_measure:
          $ref: '#/components/schemas/UnitOfMeasureEnum'
        minimum_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        reorder_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        active:
          type: boolean
        balances:
          type: array
          items:
            $ref: '#/components/schemas/ItemBalance'
          readOnly: true
        labels:
          type: array
          items:
            $ref: '#/components/schemas/ItemLabel'
          readOnly: true
        description:
          type: string
        attributes:
          description: Type-specific specifications. Radios, cable and hand tools
            have little in common.
    PatchedLabel:
      type: object
      description: |-
        A label as an administrator prints and revokes it.

        ``code`` is read-only in both directions of a write: it is minted here,
        from ``Label.mint_unique_code``, and printing is the one moment it is
        decided. A client that could choose one could choose a code outside the
        alphabet the resolver's folding depends on, or one already on a sticker
        somewhere -- and a client that could change one would 404 a sticker
        already out on a shelf.

        ``revoked`` is a boolean rather than a writable ``revoked_at`` because the
        server owns the clock: a client that could name the moment could revoke a
        sticker in the future, and a sticker is either honoured or it is not.
        Setting it back to false un-revokes, so revoking the wrong label is undone
        rather than worked around with a reprint.
      properties:
        code:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/LabelKindEnum'
          readOnly: true
        quantity:
          type:
          - string
          - 'null'
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          description: 'How much of the item one scan of this label stands for: a
            packet of 100 zip ties is 100. Null on a location label, which stands
            for no quantity of anything.'
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        item:
          type:
          - integer
          - 'null'
        location:
          type:
          - integer
          - 'null'
        revoked:
          type: boolean
          writeOnly: true
          description: True revokes this label, false restores it. The timestamp is
            the server's.
    PatchedLocation:
      type: object
      description: Somewhere stock can be, including a volunteer holding it.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        kind:
          $ref: '#/components/schemas/LocationKindEnum'
        parent:
          type:
          - integer
          - 'null'
        held_by:
          type:
          - integer
          - 'null'
        active:
          type: boolean
    PatchedVolunteerDetail:
      type: object
      description: |-
        A volunteer as an administrator reads and repairs them.

        Adds the two fields that decide whether the pick-list offers somebody.
        Merging is a first-class operation rather than a cleanup script
        (docs/data-model.md), and this is where it happens: ``merged_into`` points
        a duplicate at whoever survived, and the ledger is left exactly as it was.
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
          type: string
          maxLength: 100
        email:
          oneOf:
          - type:
            - string
            - 'null'
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        slack_id:
          type:
          - string
          - 'null'
          maxLength: 50
        active:
          type: boolean
        merged_into:
          type:
          - integer
          - 'null'
          description: Set when this record is a duplicate of another volunteer.
    StockMovement:
      type: object
      description: One recorded line, as it is read back.
      properties:
        id:
          type: integer
          readOnly: true
        item:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        from_location:
          type:
          - integer
          - 'null'
        to_location:
          type:
          - integer
          - 'null'
      required:
      - id
      - item
      - quantity
    StockMovementInput:
      type: object
      description: One line of a submitted batch.
      properties:
        item:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        from_location:
          type:
          - integer
          - 'null'
        to_location:
          type:
          - integer
          - 'null'
      required:
      - item
      - quantity
    StockTransaction:
      type: object
      description: |-
        A recorded batch, as it is read back.

        Renders a response the view has assembled rather than a bare model: both
        ``lines`` and ``warnings`` are attributes the view attaches, so the rows
        are read once and the balances behind the warnings once.
      properties:
        id:
          type: integer
          readOnly: true
        idempotency_key:
          type:
          - string
          - 'null'
          maxLength: 64
        kind:
          $ref: '#/components/schemas/TransactionKindEnum'
        actor:
          type: integer
        occurred_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
          readOnly: true
        reason:
          type: string
          maxLength: 100
        job_reference:
          type: string
          description: Install or node this relates to, e.g. NN217.
          maxLength: 50
        note:
          type: string
        movements:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
          readOnly: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/StockTransactionWarning'
          readOnly: true
      required:
      - actor
      - id
      - kind
      - movements
      - recorded_at
      - warnings
    StockTransactionCreate:
      type: object
      description: |-
        A batch as it is submitted: one act, many lines.

        Movements name items by id, never by label code. The client has already
        resolved every code it scanned, and decision 0011 section 6 says what a
        second resolution path here would cost.
      properties:
        idempotency_key:
          type:
          - string
          - 'null'
          description: 'Any string of your own. These prefixes belong to writers of
            this application''s own and are refused: ''sheet:'' (the sheet import),
            ''demo:'' (the demo seed).'
          maxLength: 64
        kind:
          $ref: '#/components/schemas/TransactionKindEnum'
        actor:
          type: integer
        occurred_at:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 100
        job_reference:
          type: string
          description: Install or node this relates to, e.g. NN217.
          maxLength: 50
        note:
          type: string
        movements:
          type: array
          items:
            $ref: '#/components/schemas/StockMovementInput'
      required:
      - actor
      - kind
      - movements
    StockTransactionWarning:
      type: object
      description: |-
        Stock went negative. The movement was recorded anyway; see decision
        0011, "Insufficient stock is a warning, not a rejection".
      properties:
        item:
          type: integer
        location:
          type: integer
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        detail:
          type: string
      required:
      - balance
      - detail
      - item
      - location
    Throttled:
      type: object
      description: |-
        Too many submissions, too fast. Nothing was recorded; send it again later.

        ``code`` is constant, so a client branches on it instead of on the prose,
        and ``retry_after_seconds`` is the same number as the Retry-After header,
        so a countdown can be rendered rather than a sentence read.
      properties:
        detail:
          type: string
        code:
          type: string
        retry_after_seconds:
          type: integer
      required:
      - code
      - detail
      - retry_after_seconds
    TransactionKindEnum:
      enum:
      - checkout
      - checkin
      - receipt
      - consumption
      - transfer
      - adjustment
      - count
      type: string
      description: |-
        * `checkout` - Check out
        * `checkin` - Check in
        * `receipt` - Receipt
        * `consumption` - Used at a job
        * `transfer` - Transfer
        * `adjustment` - Adjustment
        * `count` - Stock count
    UnitOfMeasureEnum:
      enum:
      - each
      - metre
      - foot
      type: string
      description: |-
        * `each` - Each
        * `metre` - Metre
        * `foot` - Foot
    ValidationError:
      type: object
      description: |-
        A request refused for what it said -- a body a serializer would not take, or a query parameter a filter could not parse.

        Each key is a field of the submission and each value is every complaint about that field; `non_field_errors` carries the complaints about the request as a whole.

        A few operations refuse in a shape of their own, where a field name cannot carry what they have to say; each of those says so in its own description.
      additionalProperties:
        type: array
        items:
          type: string
    Volunteer:
      type: object
      description: |-
        A volunteer as the pick-list shows them.

        ``email`` and ``slack_id`` are here because two people called Sean are the
        whole reason this list is searched before anyone adds themselves; without
        something to tell them apart the picker cannot help.

        WHAT A CALLER WITH NO SESSION IS SENT IS A SETTING, and a provisional one
        -- ``ANONYMOUS_PAYLOAD``, whose default is ``full`` and so is exactly the
        three fields above. ``inventory_tng.postures`` says what the other two
        words mean and ``inventory-tng-81f7.4`` is what takes them out again once
        ``inventory-tng-81f7`` has chosen. This is two representations keyed on who
        is asking rather than a field deleted from the model: an administrator
        signs in and keeps the whole record, which is what makes merging duplicates
        possible at all.
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
          type: string
          maxLength: 100
        email:
          oneOf:
          - type:
            - string
            - 'null'
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        slack_id:
          type:
          - string
          - 'null'
          maxLength: 50
      required:
      - display_name
      - id
    VolunteerConflict:
      type: object
      description: |-
        The identifier is taken, by a record the pick-list will not show.

        A plain 400 is the right answer when the holder is somebody the searcher
        could have found for themselves. When the holder is a merged duplicate or a
        retired record it is a dead end -- the endpoint exists to serve
        self-registration *after* a search found nothing, and the search does not
        offer either. So the holder is named here instead, resolved forward through
        the merge to whoever survived it, and ``code`` and ``selectable`` are
        constants a client branches on rather than prose it has to read. See
        decision 0015.

        ``volunteer`` is the record to act on, not the one that holds the
        identifier: the survivor of the merge, or -- for a retired record, which
        nothing survived -- the record itself.
      properties:
        detail:
          type: string
        code:
          $ref: '#/components/schemas/CodeEnum'
        field:
          $ref: '#/components/schemas/FieldEnum'
        volunteer:
          $ref: '#/components/schemas/Volunteer'
        selectable:
          type: boolean
      required:
      - code
      - detail
      - field
      - selectable
      - volunteer
    VolunteerDetail:
      type: object
      description: |-
        A volunteer as an administrator reads and repairs them.

        Adds the two fields that decide whether the pick-list offers somebody.
        Merging is a first-class operation rather than a cleanup script
        (docs/data-model.md), and this is where it happens: ``merged_into`` points
        a duplicate at whoever survived, and the ledger is left exactly as it was.
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
          type: string
          maxLength: 100
        email:
          oneOf:
          - type:
            - string
            - 'null'
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        slack_id:
          type:
          - string
          - 'null'
          maxLength: 50
        active:
          type: boolean
        merged_into:
          type:
          - integer
          - 'null'
          description: Set when this record is a duplicate of another volunteer.
      required:
      - display_name
      - id
    WhereEnum:
      enum:
      - scan
      - outbox
      - print
      - api
      - app
      type: string
      description: |-
        * `scan` - scan
        * `outbox` - outbox
        * `print` - print
        * `api` - api
        * `app` - app
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
