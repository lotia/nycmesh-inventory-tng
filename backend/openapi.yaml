openapi: 3.1.1
info:
  title: NYC Mesh Inventory API
  version: 0.1.0
  description: Inventory tracking for NYC Mesh. See docs/architecture.md.
paths:
  /api:
    get:
      operationId: root_retrieve
      description: |-
        The list of endpoints this API offers.

        Exists so the API is discoverable without reading the source or knowing the
        URL layout in advance: fetch this, follow the links.

        Fetching it also hands the browser a CSRF token. Session authentication
        enforces CSRF on every write, and a single-page app never renders a Django
        template, so without this nothing would set the cookie and no browser
        could post anything. The index is the right place for it: it is what a
        client fetches first, and it is public, so the token is available before
        anyone has logged in.
      summary: List the available endpoints
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
          description: ''
  /api/categories:
    get:
      operationId: categories_list
      description: The item groupings, for narrowing the catalogue.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
  /api/healthz:
    get:
      operationId: healthz_retrieve
      description: |-
        Liveness and readiness probe used by Kubernetes.

        Issues a trivial query so the check fails when the database is
        unreachable, rather than reporting healthy while unable to serve.
        See docs/deployment.md.
      summary: Liveness and readiness probe
      tags:
      - healthz
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
          description: ''
  /api/items:
    get:
      operationId: items_list
      description: |-
        The catalogue, with the stock behind it.

        This is the screen the volunteer mockup is almost entirely made of: every
        item, its count, and a way to add some to the cart. See decision 0011.
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Name contains
      tags:
      - items
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedItemList'
          description: ''
  /api/labels:
    get:
      operationId: labels_list
      description: |-
        Every label that still points at something.

        Unpaginated, deliberately. This exists to be fetched once and cached, so
        that a scan resolves without a round trip from a basement (decision 0011);
        handing it back in pages would make the client stitch them together for no
        benefit at a few hundred rows.
      tags:
      - labels
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LabelMap'
          description: ''
  /api/labels/{code}:
    get:
      operationId: labels_retrieve
      description: |-
        Resolve one scanned or typed code.

        A revoked label resolves rather than 404s: the sticker is superseded, but
        it still says what it pointed at, and refusing the scan would block a
        volunteer over bookkeeping. The client is told, through ``revoked_at``,
        and can say so.
      summary: Resolve a scanned label code
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - labels
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelResolve'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
          description: ''
  /api/locations:
    get:
      operationId: locations_list
      description: |-
        Everywhere stock can be. A pick-list, like volunteers.

        Retired locations are not offered, and `active` is deliberately not a
        filter: the queryset already fixes it, so the parameter could only ever
        return nothing. Same shape as the volunteer pick-list, which narrows on a
        queryset rather than advertising `active` either.
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - hub
          - room
          - shelf
          - vehicle
          - volunteer_custody
          - warehouse
        description: |-
          * `warehouse` - Warehouse
          * `hub` - Hub
          * `room` - Room
          * `shelf` - Shelf
          * `volunteer_custody` - Volunteer custody
          * `vehicle` - Vehicle
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
      tags:
      - locations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationList'
          description: ''
  /api/stock/transactions:
    post:
      operationId: stock_transactions_create
      description: |-
        Record one batch: one transaction, one movement per line, one commit.

        This is the endpoint the project exists for. The system it replaces could
        carry one item per form submission, so people submitted the same form over
        and over; here that is one request. See
        docs/decisions/0011-qr-batch-scanning.md.
      summary: Record a batch of stock movements
      tags:
      - stock
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockTransactionCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransaction'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockTransaction'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRejected'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchInconsistent'
          description: ''
  /api/volunteers:
    get:
      operationId: volunteers_list
      description: |-
        The volunteer pick-list, and the way onto it.

        Volunteers are a pick-list with no password (decision 0008 point 5). The
        client searches this before offering to add anyone, which is what stops a
        second generation of the duplicate spellings that decision counts.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Fuzzy name search
      tags:
      - volunteers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVolunteerList'
          description: ''
    post:
      operationId: volunteers_create
      description: |-
        The volunteer pick-list, and the way onto it.

        Volunteers are a pick-list with no password (decision 0008 point 5). The
        client searches this before offering to add anyone, which is what stops a
        second generation of the duplicate spellings that decision counts.
      tags:
      - volunteers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Volunteer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Volunteer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Volunteer'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volunteer'
          description: ''
components:
  schemas:
    ApiError:
      type: object
      description: |-
        One thing wrong, and where.

        ``index`` is the position in the submitted ``movements`` array, or null
        when the problem is with the batch itself rather than one of its lines.
      properties:
        index:
          type:
          - integer
          - 'null'
        field:
          type: string
        detail:
          type: string
      required:
      - detail
      - field
      - index
    ApiRoot:
      type: object
      properties:
        health:
          type: string
          format: uri
        volunteers:
          type: string
          format: uri
        items:
          type: string
          format: uri
        locations:
          type: string
          format: uri
        categories:
          type: string
          format: uri
        labels:
          type: string
          format: uri
        schema:
          type: string
          format: uri
        docs:
          type: string
          format: uri
      required:
      - categories
      - docs
      - health
      - items
      - labels
      - locations
      - schema
      - volunteers
    BatchInconsistency:
      type: object
      description: One line that disagrees with the batch's declared kind.
      properties:
        index:
          type: integer
        detail:
          type: string
      required:
      - detail
      - index
    BatchInconsistent:
      type: object
      description: Every line is valid on its own, but they do not add up to the kind
        claimed.
      properties:
        detail:
          type: string
        kind:
          type: string
        inconsistent:
          type: array
          items:
            $ref: '#/components/schemas/BatchInconsistency'
      required:
      - detail
      - inconsistent
      - kind
    BatchRejected:
      type: object
      description: Nothing was saved. Every bad line is listed, so one pass fixes
        them all.
      properties:
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
      required:
      - detail
      - errors
    Category:
      type: object
      description: A grouping of items, nestable.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        parent:
          type:
          - integer
          - 'null'
      required:
      - id
      - name
    HealthCheck:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Item:
      type: object
      description: |-
        A catalogue entry with the stock behind it.

        Balances and labels are attached by the view in bulk. Reading them per
        item would be two queries per row on the screen the volunteer looks at
        most.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        category:
          type: integer
        unit_of_measure:
          $ref: '#/components/schemas/UnitOfMeasureEnum'
        minimum_stock:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        reorder_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        active:
          type: boolean
        balances:
          type: array
          items:
            $ref: '#/components/schemas/ItemBalance'
          readOnly: true
        labels:
          type: array
          items:
            $ref: '#/components/schemas/ItemLabel'
          readOnly: true
      required:
      - balances
      - category
      - id
      - labels
      - name
    ItemBalance:
      type: object
      description: How much of one item is at one location, derived from the ledger.
      properties:
        location:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
      required:
      - location
      - quantity
    ItemLabel:
      type: object
      description: |-
        An active label on this item, and what one scan of it means.

        The distinct quantities across an item's labels *are* its packaging, and
        are what the list offers as one-tap chips. See decision 0011 section 5.
      properties:
        code:
          type: string
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
      required:
      - code
      - quantity
    LabelKindEnum:
      enum:
      - item
      - location
      type: string
      description: |-
        * `item` - item
        * `location` - location
    LabelMap:
      type: object
      description: |-
        One label in the map the client caches.

        Drops ``revoked_at``, which this queryset guarantees is null, a few
        hundred times over. See LabelListView for why this response's size is
        worth caring about.
      properties:
        code:
          type: string
          maxLength: 32
        kind:
          allOf:
          - $ref: '#/components/schemas/LabelKindEnum'
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          description: 'How much of the item one scan of this label stands for: a
            packet of 100 zip ties is 100.'
        item:
          type:
          - integer
          - 'null'
        location:
          type:
          - integer
          - 'null'
      required:
      - code
      - kind
    LabelResolve:
      type: object
      description: |-
        What a scanned code points at.

        ``quantity`` is part of the contract because the client cannot spell out
        the cart line without it. See decision 0011 section 5.
      properties:
        code:
          type: string
          maxLength: 32
        kind:
          allOf:
          - $ref: '#/components/schemas/LabelKindEnum'
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
          description: 'How much of the item one scan of this label stands for: a
            packet of 100 zip ties is 100.'
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        item:
          type:
          - integer
          - 'null'
        location:
          type:
          - integer
          - 'null'
      required:
      - code
      - kind
    Location:
      type: object
      description: Somewhere stock can be, including a volunteer holding it.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        kind:
          $ref: '#/components/schemas/LocationKindEnum'
        parent:
          type:
          - integer
          - 'null'
        held_by:
          type:
          - integer
          - 'null'
        active:
          type: boolean
      required:
      - id
      - kind
      - name
    LocationKindEnum:
      enum:
      - warehouse
      - hub
      - room
      - shelf
      - volunteer_custody
      - vehicle
      type: string
      description: |-
        * `warehouse` - Warehouse
        * `hub` - Hub
        * `room` - Room
        * `shelf` - Shelf
        * `volunteer_custody` - Volunteer custody
        * `vehicle` - Vehicle
    NotFound:
      type: object
      description: Nothing here. Said in a typed body so a client can render it.
      properties:
        detail:
          type: string
      required:
      - detail
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedItemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    PaginatedLocationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Location'
    PaginatedVolunteerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Volunteer'
    StockMovement:
      type: object
      description: One recorded line, as it is read back.
      properties:
        id:
          type: integer
          readOnly: true
        item:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        from_location:
          type:
          - integer
          - 'null'
        to_location:
          type:
          - integer
          - 'null'
      required:
      - id
      - item
      - quantity
    StockMovementInput:
      type: object
      description: One line of a submitted batch.
      properties:
        item:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        from_location:
          type:
          - integer
          - 'null'
        to_location:
          type:
          - integer
          - 'null'
      required:
      - item
      - quantity
    StockTransaction:
      type: object
      description: |-
        A recorded batch, as it is read back.

        Renders a response the view has assembled rather than a bare model: both
        ``lines`` and ``warnings`` are attributes the view attaches, so the rows
        are read once and the balances behind the warnings once.
      properties:
        id:
          type: integer
          readOnly: true
        idempotency_key:
          type:
          - string
          - 'null'
          maxLength: 64
        kind:
          $ref: '#/components/schemas/TransactionKindEnum'
        actor:
          type: integer
        occurred_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
          readOnly: true
        reason:
          type: string
          maxLength: 100
        job_reference:
          type: string
          description: Install or node this relates to, e.g. NN217.
          maxLength: 50
        note:
          type: string
        movements:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
          readOnly: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/StockTransactionWarning'
          readOnly: true
      required:
      - actor
      - id
      - kind
      - movements
      - recorded_at
      - warnings
    StockTransactionCreate:
      type: object
      description: |-
        A batch as it is submitted: one act, many lines.

        Movements name items by id, never by label code. The client has already
        resolved every code it scanned, and accepting codes here would add a second
        resolution path that fails after the volunteer thinks they are done.
      properties:
        idempotency_key:
          type:
          - string
          - 'null'
          maxLength: 64
        kind:
          $ref: '#/components/schemas/TransactionKindEnum'
        actor:
          type: integer
        occurred_at:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 100
        job_reference:
          type: string
          description: Install or node this relates to, e.g. NN217.
          maxLength: 50
        note:
          type: string
        movements:
          type: array
          items:
            $ref: '#/components/schemas/StockMovementInput'
      required:
      - actor
      - kind
      - movements
    StockTransactionWarning:
      type: object
      description: |-
        Stock went negative. The movement was recorded anyway; see decision
        0011, "Insufficient stock is a warning, not a rejection".
      properties:
        item:
          type: integer
        location:
          type: integer
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        detail:
          type: string
      required:
      - balance
      - detail
      - item
      - location
    TransactionKindEnum:
      enum:
      - checkout
      - checkin
      - receipt
      - consumption
      - transfer
      - adjustment
      - count
      type: string
      description: |-
        * `checkout` - Check out
        * `checkin` - Check in
        * `receipt` - Receipt
        * `consumption` - Used at a job
        * `transfer` - Transfer
        * `adjustment` - Adjustment
        * `count` - Stock count
    UnitOfMeasureEnum:
      enum:
      - each
      - metre
      - foot
      type: string
      description: |-
        * `each` - Each
        * `metre` - Metre
        * `foot` - Foot
    Volunteer:
      type: object
      description: |-
        A volunteer as the pick-list shows them.

        ``email`` and ``slack_id`` are here because two people called Sean are the
        whole reason this list is searched before anyone adds themselves; without
        something to tell them apart the picker cannot help.
      properties:
        id:
          type: integer
          readOnly: true
        display_name:
          type: string
          maxLength: 100
        email:
          oneOf:
          - type:
            - string
            - 'null'
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        slack_id:
          type:
          - string
          - 'null'
          maxLength: 50
      required:
      - display_name
      - id
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
