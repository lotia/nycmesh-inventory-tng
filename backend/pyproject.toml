[project]
name = "inventory-tng"
version = "0.1.0"
description = "Inventory tracking for NYC Mesh"
authors = [
    { name = "Ali Asad Lotia", email = "ali.asad.lotia@gmail.com" },
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "fastapi>=0.162",
    "jinja2>=3.1",
    "limits>=5.8",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-logging>=0.66b0",
    "opentelemetry-instrumentation-psycopg>=0.66b0",
    "opentelemetry-sdk>=1.45",
    "psycopg[binary]>=3.3",
    "pyotp>=2.10",
    "python-dotenv>=1.2",
    "python-multipart>=0.0.33",
    "segno>=1.6",
    "servestatic[brotli]>=4.4",
    "sqlalchemy>=2.1",
    "structlog>=26.1",
    "tzdata>=2026.6",
    "uvicorn>=0.54",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
# Only diff-cover, so CI's check-changed-lines job installs no more.
coverage = ["diff-cover>=11.0"]
dev = [
    { include-group = "coverage" },
    "httpx2>=2.16",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-randomly>=5.0",
    "ruff>=0.17",
    "ty>=0.0.95",
]

[tool.uv]
# A floor: mise.toml pins the uv everyone runs (CONTRIBUTING.md, Dependency
# updates).
required-version = ">=0.13"

[tool.alembic]
script_location = "%(here)s/migrations"
# Dated, so files sort in the order they were written.
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s"

# New migrations come out lint-clean and formatted.
[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[tool.ruff.lint]
extend-select = [
    "ANN",  # every function is annotated
    "B",    # likely bugs
    "FAST", # FastAPI
    "I",    # import order
    "PT",   # pytest style
    "RUF",
    "SIM",
    "TID",  # banned APIs, below
    "UP",   # modern syntax for the Python version in requires-python
]

[tool.ruff.lint.isort]
# What tests import from tests/ (pythonpath, below), not from a package.
known-local-folder = ["databases", "helpers"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.TestCase".msg = "Write tests in pytest style: plain functions, fixtures and assert."

# The floors and how they are measured: CONTRIBUTING.md, Coverage.
[tool.coverage.run]
branch = true
source = ["inventory_tng"]

[tool.coverage.report]
fail_under = 94
# Only seen by the type checker, never run.
exclude_also = ["if TYPE_CHECKING:"]
skip_covered = true
show_missing = true

# Every changed line, both ways at each branch (mise run check-changed-lines
# and CI, with -c).
[tool.diff_cover]
fail_under = 100
branch_coverage = true

[tool.pytest]
testpaths = ["tests"]
# Where tests import helpers and databases from.
pythonpath = ["tests"]
strict = true
filterwarnings = ["error"]
# What a test tests (tests/test_requests_at_once.py's docstring).
markers = [
    "concurrency: two transactions at once, on two database connections",
    "end_to_end: requests through the whole app",
    "helper: one helper's contract, on a real database session",
    "breaks_pool_order: takes connections out of the pools' order on purpose (db.Database)",
]
