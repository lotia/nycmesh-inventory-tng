[project]
name = "inventory-tng-backend"
version = "0.1.0"
description = "Django REST backend for the NYC Mesh inventory system"
requires-python = ">=3.14"
# SPDX expression only. The license text lives once, at the repository root
# (../LICENSE); no license-files entry, because it sits outside this project
# directory and build backends reject that.
license = "MIT"

# Pinned to minor: this is a deployed application, not a library, so
# reproducibility beats flexibility. See docs/decisions/ for version rationale.
dependencies = [
    "django==6.1.*",
    "djangorestframework==3.18.*",
    "django-environ==0.12.*",
    "psycopg[binary]==3.3.*",
    "gunicorn==26.1.*",
    "drf-spectacular==0.30.*",
    "django-cors-headers==4.9.*",
    "django-filter==25.*",
    "whitenoise==6.11.*",
    "django-simple-history==3.*",
    "django-allauth[mfa,socialaccount]>=65.19.1",
    # The QR encoder. Pure Python, no image library, and it exposes the
    # version, mode and error correction level of what it produced -- which is
    # what makes the decisions in inventory/labels.py assertable.
    "segno==1.6.*",
    # The Content-Security-Policy header. Pinned like everything else here: the
    # setting it reads is named CONTENT_SECURITY_POLICY only from 4.0, and a
    # major that renamed it again would silently serve no policy at all.
    "django-csp==4.0.*",
    "drf-spectacular-sidecar>=2026.8.1",
    # One dependency for two drawings of a record rather than two: the same
    # processor chain feeds a JSON renderer for a collector and a column
    # renderer for a person, and it bridges stdlib logging so that Django's
    # own loggers and gunicorn's come out looking like ours. Decision 0021.
    "structlog==25.*",
    # Reads the exported inventory workbook. A runtime dependency rather than a
    # development one because profile_sheet, and the importer that follows it,
    # are management commands that ship inside the backend image: Django
    # imports a command's module to run it, so a dependency missing from the
    # image is a command that lists in `manage.py help` and raises on use.
    # Not because the migrate Job needs it -- that Job runs `migrate` and
    # mounts nothing, and the import is run by hand.
    "openpyxl==3.1.*",
]

[dependency-groups]
dev = [
    "pytest==8.*",
    "pytest-django==4.*",
    "pytest-cov==7.*",
    "ruff==0.14.*",
    "ty==0.0.*",
    # Type stubs. ty reads these; they are not tied to any one type checker.
    "django-stubs==5.*",
    "djangorestframework-stubs==3.*",
    # Imported directly by the OpenAPI schema tests. It arrives transitively via
    # drf-spectacular anyway, but a test that imports it should declare it.
    "pyyaml==6.*",
    # A decoder, and deliberately not the encoder above: decision 0011 asks
    # for the generator's output to be decoded and checked, and an encoder
    # agreeing with itself would prove nothing. Tests only.
    "zxing-cpp==3.1.*",
    "pyotp>=2.10.0",
]

# --------------------------------------------------------------------------
# Style: ruff replaces black + isort + flake8.
# See docs/decisions/0004-python-tooling.md
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting (replaces isort)
    "UP",   # pyupgrade: keep syntax current
    "B",    # bugbear: likely bugs
    "C4",   # comprehension clarity
    "SIM",  # simplifiable code
    "DJ",   # Django-specific checks
    "ANN",  # type annotations are required -- see DEVELOPERS.md "Typing"
    "RUF",  # ruff's own rules
]

ignore = [
    # Django and DRF configure classes with plain mutable attributes
    # (permission_classes, serializer_class lists, Meta.fields). Annotating
    # every one with ClassVar fights the framework for no safety gain.
    "RUF012",
    # `Any` is a legal annotation here, on purpose.
    # See docs/decisions/0009-type-annotations-required.md
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# Generated by makemigrations; not hand-maintained, so the annotation and line
# length rules would be enforcing style on output nobody writes by hand.
"**/migrations/*" = ["E501", "ANN"]

# --------------------------------------------------------------------------
# Tests. Coverage is always on, so a local run and a CI run enforce the same
# rules. See DEVELOPERS.md "Testing and coverage".
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "inventory_tng.settings"
pythonpath = ["src"]
python_files = ["test_*.py", "tests.py"]
addopts = "--cov --cov-report=term-missing --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    # Entry points executed by Django or the server, never by tests.
    "src/manage.py",
    "*/wsgi.py",
    "*/asgi.py",
    # Read by gunicorn before Django exists, and by nothing else. What it
    # computes is `logging_config`, which is covered.
    "*/gunicorn.conf.py",
    # Declarative configuration, not behaviour. Imported by every test, so
    # counting it would inflate the number without testing anything.
    "*/settings.py",
    # Generated by makemigrations.
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
# Applies to the code left after the omissions above -- that is, code that
# actually implements behaviour. Raising this is welcome; lowering it needs a
# reason in the pull request.
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
