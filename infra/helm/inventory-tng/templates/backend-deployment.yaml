{{- include "inventory-tng.connectTimeoutIsShortEnough" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inventory-tng.fullname" . }}-backend
  labels:
    {{- include "inventory-tng.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "inventory-tng.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "inventory-tng.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- include "inventory-tng.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ include "inventory-tng.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            {{- include "inventory-tng.backendEnv" . | nindent 12 }}
          envFrom:
            {{- include "inventory-tng.backendEnvFrom" . | nindent 12 }}
          # No Host header: the kubelet dials the pod's own address, and that
          # address is one this deployment answers to, because DJANGO_POD_IP
          # puts it in ALLOWED_HOSTS. A probe asserting some other name about
          # itself would pass while the address it actually used was refused,
          # which is the shape of the bug this replaced.
          #
          # Liveness and readiness ask different questions, so they ask
          # different paths. Which path belongs to which, what the split gives
          # up as well as what it buys, and why swapping the two back is an
          # outage rather than an untidiness, are all
          # docs/deployment.md#health-checks.
          #
          # Every field either probe leans on is written out below, defaults
          # included, because that document quotes what they come to and
          # nothing about a default appears near here to check it against.
          # test_chart.py holds both against it.
          livenessProbe:
            # /api/livez reaches for nothing, so a restart -- which is the
            # only thing a failure here buys -- is a cure for anything it can
            # report.
            httpGet:
              path: /api/livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # /api/healthz runs the query, which is the whole point of it: a
            # dependency belongs on the probe whose failure stops traffic
            # rather than on the one whose failure kills the process.
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            # Read from a define because the ceiling on the database connect
            # timeout is measured against it; _helpers.tpl is where both meet.
            periodSeconds: {{ include "inventory-tng.readinessPeriodSeconds" . }}
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
