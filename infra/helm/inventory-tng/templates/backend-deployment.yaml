apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inventory-tng.fullname" . }}-backend
  labels:
    {{- include "inventory-tng.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "inventory-tng.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "inventory-tng.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ include "inventory-tng.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            {{- include "inventory-tng.backendEnv" . | nindent 12 }}
          envFrom:
            {{- include "inventory-tng.backendEnvFrom" . | nindent 12 }}
          # No Host header: the kubelet dials the pod's own address, and that
          # address is one this deployment answers to, because DJANGO_POD_IP
          # puts it in ALLOWED_HOSTS. A probe asserting some other name about
          # itself would pass while the address it actually used was refused,
          # which is the shape of the bug this replaced.
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
