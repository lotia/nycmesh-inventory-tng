apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inventory-tng.fullname" . }}-frontend
  labels:
    {{- include "inventory-tng.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "inventory-tng.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "inventory-tng.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: {{ include "inventory-tng.frontendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            # nginx forwards Django's paths here -- which ones is stated once,
            # in docs/architecture.md -- so the browser only ever sees one
            # origin and no API URL is baked into the bundle.
            - name: BACKEND_ORIGIN
              value: http://{{ include "inventory-tng.fullname" . }}-backend:{{ .Values.backend.port }}
            # Where a browser's own spans are forwarded, for whoever holds a
            # debug token. Empty here means the image's default, which refuses
            # the connection -- this chart renders no collector, and pointing
            # at the cluster's is a value somebody sets. docs/observability.md.
            {{- with .Values.frontend.collectorOrigin }}
            - name: COLLECTOR_ORIGIN
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
