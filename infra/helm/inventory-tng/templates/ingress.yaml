{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "inventory-tng.fullname" . }}
  labels:
    {{- include "inventory-tng.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- /* Defaulted so that clearing the whole tls map reaches the message
         below rather than a nil pointer. */}}
  {{- $tls := .Values.ingress.tls | default dict }}
  {{- if not $tls.terminatedElsewhere }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ required "ingress.tls.secretName is required: the app is unusable over plain HTTP, because a camera needs a secure context. Set it, or set ingress.tls.terminatedElsewhere=true if a proxy in front of this ingress terminates TLS. See docs/deployment.md." $tls.secretName }}
  {{- end }}
  rules:
    # Everything enters through the frontend, which proxies Django's paths to
    # the backend -- which ones is stated once, in docs/architecture.md. One
    # hostname, one origin, no CORS in production.
    #
    # This rule is the volunteer surface and stays reachable from anywhere,
    # which is the whole point of it: a phone, wherever the stock happens to
    # be. The administrative paths are carved out of it by ingress-admin.yaml
    # when ingress.administrative.enabled is set.
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "inventory-tng.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
{{- end }}
