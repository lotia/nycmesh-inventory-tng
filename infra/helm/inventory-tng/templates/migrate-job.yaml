{{- if .Values.migrations.enabled }}
# Schema migrations run once per release, before new pods roll out, so that
# multiple backend replicas can never apply migrations concurrently.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "inventory-tng.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "inventory-tng.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "inventory-tng.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "inventory-tng.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            {{- include "inventory-tng.backendEnv" . | nindent 12 }}
          envFrom:
            {{- include "inventory-tng.backendEnvFrom" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
