{{- if .Values.migrations.enabled }}
# Schema migrations run once per release, before new pods roll out, so that
# multiple backend replicas can never apply migrations concurrently.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "inventory-tng.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "inventory-tng.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "inventory-tng.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "inventory-tng.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          env:
            {{- include "inventory-tng.backendEnv" . | nindent 12 }}
          envFrom:
            {{- include "inventory-tng.backendEnvFrom" . | nindent 12 }}
          # Declared, because a namespace with a ResourceQuota on cpu or memory
          # REFUSES a pod that declares none -- unless a LimitRange happens to
          # fill them in, which is not something a chart may assume. The Job is
          # a pre-upgrade hook, so what that refusal looks like is not an error
          # about resources: `helm upgrade` waits for a Job that will never be
          # admitted and gives up at its timeout, with nothing in the release
          # to look at. inventory-tng-v7g.
          #
          # Its own figures rather than the backend's. This runs migrations once
          # and exits; it serves nothing, holds no connections open and has no
          # replicas, so sizing it like a web process would reserve what a
          # quota then refuses to give the pods that actually serve.
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
