# Values for the inventory-tng chart.
# Deployment procedure and the meaning of each production value are documented
# once, in docs/deployment.md. This file documents only the knobs themselves.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  repository: lotia/nycmesh-inventory-tng
  # Overridden per release; never rely on :latest in a real environment.
  tag: ""
  pullPolicy: IfNotPresent

backend:
  replicaCount: 2
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

frontend:
  replicaCount: 2
  port: 8080
  # Where the browser posts its spans, forwarded by nginx so the page's own
  # content policy stays as it is. Empty unless this cluster runs a collector;
  # nothing posts here without a signed debug token either way. See
  # docs/observability.md.
  collectorOrigin: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

django:
  debug: false
  # How much the backend says, on standard output. See docs/deployment.md.
  logLevel: "INFO"
  # Comma-separated logger=LEVEL pairs laid over logLevel, for turning one
  # subsystem up without turning everything up. See docs/deployment.md.
  logLevels: ""
  # json, so that whatever collects this cluster's container output can parse
  # it. The console drawing is for a terminal; see docs/deployment.md.
  logFormat: "json"
  # How much a refused request may write. The ingress is internet-facing and
  # that path takes no credential, so this is what stops a host scanner filling
  # a node's disk. See docs/deployment.md.
  securityLogRate: "10/min"
  # Where traces and metrics are sent, over OTLP. Empty means the SDK is not
  # started at all, which is the right default: a collector is cluster
  # infrastructure this chart does not render. See docs/deployment.md.
  otlpEndpoint: ""
  otelServiceName: "inventory-tng-backend"
  otelResourceAttributes: "deployment.environment=production"
  # The fraction of traces recorded. 1.0 here rather than the code's own
  # conservative default, so what is wanted is visible in a file. Lower it to
  # sample a subset; see docs/deployment.md.
  tracesSampler: "parentbased_traceidratio"
  tracesSamplerArg: "1.0"
  # Whether telemetry may carry personal data. This chart never ships anything
  # but "redacted". Read docs/observability.md before changing it: what it
  # admits, and what admitting it obliges of wherever the telemetry lands.
  personalData: "redacted"
  # A signed token has one volunteer's requests recorded in full. How long one
  # lasts, and how much it may cost. See docs/observability.md.
  debugTraceLifetimeSeconds: "3600"
  debugTraceRate: "60/min"
  # Every hostname a browser may use, comma-separated. Two things depend on
  # it beyond Django itself: a release whose ingress.host none of these
  # covers is refused at render time, and the pod adds its own address to
  # this list so the kubelet can probe it. docs/deployment.md#health-checks.
  allowedHosts: "inventory.nycmesh.net"
  # Empty, and expected to stay empty; see docs/deployment.md for what it does
  # and does not buy. Comma-separated.
  corsAllowedOrigins: ""
  # Proxies between the browser and Django: the ingress, then the frontend's
  # nginx. This decides whose request a rate limit counts against, so it must
  # match the real chain; see docs/deployment.md.
  numProxies: 2
  # WHICH addresses those proxies are, rather than how many there are: the
  # cluster's own, comma-separated, each an address or a CIDR block. Empty here
  # because no two clusters share one, and empty is the safe direction -- see
  # docs/deployment.md, which says which way this is dangerous to get wrong.
  trustedProxies: ""
  # How fast one client may append to the ledger or the volunteer list, which
  # take no credential. Counted per backend process; see docs/deployment.md.
  appendBurstRate: "20/min"
  appendSustainedRate: "300/hour"
  # What a browser may report about itself, on its own budget. .env.sample says
  # why it is not a share of the two above.
  clientReportRate: "30/min"
  # How long a sign-in counts as recent enough to make an administrative
  # change. Decision 0014 point 5 asks again inside a valid session; this is
  # how often. See docs/deployment.md.
  reauthenticationTimeoutSeconds: 900
  # The origin printed inside every QR code. Changing it does not change the
  # stickers already on the shelves; see docs/deployment.md.
  labelBaseUrl: "https://inventory.nycmesh.net"
  # How long a request waits for a database that is not answering before it
  # gives up. It has to stay under the readiness probe's periodSeconds, which
  # is written out in the backend Deployment; docs/deployment.md#health-checks
  # is what happens when it does not, and a test refuses the pair.
  databaseConnectTimeoutSeconds: 5
  # Name of a pre-existing Secret holding DJANGO_SECRET_KEY and DATABASE_URL.
  # Never put these in values.yaml.
  existingSecret: inventory-tng-secrets
  # Name of a second, OPTIONAL Secret holding the sign-in providers' client
  # ids and secrets. Every key in it becomes a backend environment variable,
  # so configuring Google, Slack or an OpenID Connect provider
  # (docs/decisions/0013-administrator-sign-in.md) is a Secret rather than a
  # release. A Secret that does not exist is not an error: the deployment
  # simply offers the local password path, which decision 0013 point 2 keeps
  # available whatever else is configured. Which keys go in it, and what each
  # one is, are in docs/deployment.md.
  providerSecret: inventory-tng-providers

# Runs `manage.py migrate` as a pre-upgrade Job so that scaling the backend to
# multiple replicas can never race on schema changes.
migrations:
  enabled: true

ingress:
  enabled: true
  className: nginx
  host: inventory.nycmesh.net
  tls:
    # No switch to turn TLS off: it is a functional requirement, not only a
    # security one. See docs/deployment.md.
    secretName: inventory-tng-tls
    # Set this only when TLS is terminated in front of this ingress;
    # docs/deployment.md says when that applies and what it does not mean.
    terminatedElsewhere: false
  annotations: {}
  # Decision 0013 point 6: the routes only an administrator uses are also
  # restricted to a network volunteers do not need. Rendered as a second
  # Ingress; docs/deployment.md#administrative-access says why it has to be.
  #
  # OFF by default, and that is not a recommendation: an empty allow-list on a
  # first install would lock out the very administrator who has not created the
  # first superuser yet. What is true while it is off, and what a deployer has
  # to set, are in docs/deployment.md#administrative-access.
  administrative:
    enabled: false
    # Prefixes, matched per path segment. Everything not listed here stays
    # reachable from anywhere, because a volunteer on a phone needs it -- which
    # paths those are, and why the administrative operations of /api are not on
    # this list, is in docs/deployment.md#administrative-access.
    paths:
      - /admin
      - /accounts
      - /api/labels/sheet
      - /api/schema
      - /api/docs
    # The networks permitted to reach them: the mesh, an office, the pool a VPN
    # hands out. Empty with `enabled: true` is refused at render time rather
    # than producing an Ingress that restricts nothing.
    allowedSourceRanges: []
    # Which annotation carries that list, because every controller spells it
    # differently. The default is ingress-nginx's. HAProxy's is
    # `haproxy.org/whitelist`; Traefik has no equivalent annotation and wants a
    # middleware named in `annotations` below instead.
    sourceRangeAnnotation: nginx.ingress.kubernetes.io/whitelist-source-range
    # Annotations added to the administrative Ingress and to nothing else. This
    # is the same switch for the other two shapes of the restriction: an
    # identity-aware proxy (`nginx.ingress.kubernetes.io/auth-url` and
    # `auth-signin`), or a mesh or Traefik middleware
    # (`traefik.ingress.kubernetes.io/router.middlewares`). Setting these alone,
    # with no CIDRs, is a complete configuration.
    annotations: {}
