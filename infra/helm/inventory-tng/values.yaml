# Values for the inventory-tng chart.
# Deployment procedure and the meaning of each production value are documented
# once, in docs/deployment.md. This file documents only the knobs themselves.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  repository: lotia/nycmesh-inventory-tng
  # Overridden per release; never rely on :latest in a real environment.
  tag: ""
  pullPolicy: IfNotPresent

backend:
  replicaCount: 2
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

frontend:
  replicaCount: 2
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

django:
  debug: false
  allowedHosts: "inventory.nycmesh.net"
  # Empty, and expected to stay empty; see docs/deployment.md for what it does
  # and does not buy. Comma-separated.
  corsAllowedOrigins: ""
  # How fast one client may append to the ledger or the volunteer list, which
  # take no credential. Counted per backend process; see docs/deployment.md.
  appendBurstRate: "20/min"
  appendSustainedRate: "300/hour"
  # Name of a pre-existing Secret holding DJANGO_SECRET_KEY and DATABASE_URL.
  # Never put these in values.yaml.
  existingSecret: inventory-tng-secrets

# Runs `manage.py migrate` as a pre-upgrade Job so that scaling the backend to
# multiple replicas can never race on schema changes.
migrations:
  enabled: true

ingress:
  enabled: true
  className: nginx
  host: inventory.nycmesh.net
  tls:
    # No switch to turn TLS off: it is a functional requirement, not only a
    # security one. See docs/deployment.md.
    secretName: inventory-tng-tls
    # Set this only when something in front of this ingress terminates TLS --
    # a load balancer, a service mesh. It stops the Ingress asking for a
    # certificate; it does not make plain HTTP to the browser supported.
    terminatedElsewhere: false
  annotations: {}
