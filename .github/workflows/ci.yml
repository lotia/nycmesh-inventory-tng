name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is not one of the defaults, and the history job below
    # reads draft state. See DEVELOPERS.md#merging.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: docker.io/library/postgres:18
        env:
          POSTGRES_DB: inventory_tng
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
        ports: ["5432:5432"]
        # -U AND -d, and the same two values the service is given above. Why a
        # probe missing them passes anyway is on compose.yaml's healthcheck,
        # which had the same fault in its -d half and was fixed first.
        #
        # What is different here is the -U half: a bare pg_isready defaults it
        # to the OS user it runs as, which in this image is `postgres` -- a role
        # the entrypoint never creates, because initdb runs with
        # --username="$POSTGRES_USER". Measured against postgres:18: every probe
        # was answered `FATAL: role "postgres" does not exist` and the container
        # reported healthy regardless. inventory-tng-0kgq.
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory_tng"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_tng
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # test_chart.py renders the deployment chart and holds it against these
      # settings, so this job needs helm. The runner image happens to ship one;
      # depending on that would make an unrelated job fail the day it stops.
      - uses: azure/setup-helm@v4
      - run: uv sync --locked
      # Commands mirror DEVELOPERS.md "Code style" and "Testing and coverage".
      # Thresholds and rules live in backend/pyproject.toml, not here, so a
      # local run and this job enforce identical rules.
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check src
      - name: Test and coverage
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Commands mirror DEVELOPERS.md "Code style" and "Testing and coverage".
      # Rules and thresholds live in frontend/biome.json and
      # frontend/vite.config.ts, not here.
      - name: Lint and format check
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test and coverage
        run: npm test
      - name: Build
        run: npm run build

  integration:
    name: Integration (browser)
    runs-on: ubuntu-latest
    # Cannot be run by either job above; see DEVELOPERS.md "Integration tests".
    services:
      postgres:
        image: docker.io/library/postgres:18
        env:
          POSTGRES_DB: inventory_tng
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
        ports: ["5432:5432"]
        # -U and -d for the reason the Backend job's service gives above.
        options: >-
          --health-cmd "pg_isready -U inventory -d inventory_tng"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_tng
      # The seed command refuses to run without this, deliberately: it creates
      # a login whose password is in the repository.
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: backend
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # The browser is a 115MB download, so it is cached on the resolved
      # version rather than fetched on every run.
      - name: Resolve browser version
        id: playwright
        working-directory: frontend
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Install browser dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend
      # Playwright starts Django and Vite itself, migrates and seeds. See
      # frontend/playwright.config.ts.
      - name: Integration tests
        run: npm run test:integration
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    # Every render docs/deployment.md prints, and no more, because a runner has
    # no cluster to install into. All of them here rather than some of them
    # here and some in the setup job: the variants differ from the plain render
    # by a flag or two, and a chart that has stopped rendering should say so
    # once. See DEVELOPERS.md#what-ci-proves.
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint infra/helm/inventory-tng
      - name: Render manifests
        run: helm template test infra/helm/inventory-tng --set image.tag=ci
      # The administrative ingress is off by default, so the plain render above
      # never draws it. The grep is the assertion: rendering clean while
      # producing no second host and no address restriction would be a chart
      # that has quietly stopped offering what the document sells.
      - name: Render them again with the administrative ingress on
        run: |
          helm template test infra/helm/inventory-tng --set image.tag=ci \
            --set ingress.administrative.enabled=true \
            --set 'ingress.administrative.allowedSourceRanges={10.69.0.0/16}' \
            | grep -E 'name:.*-admin|whitelist|^ +- path:'

  images:
    name: Container images
    runs-on: ubuntu-latest
    # Both images, built from a matrix so a broken Dockerfile is named by the
    # job that failed. This is also what fills the `type=gha` cache the
    # `Compose stack` job below reads, which is why that one does not build
    # cold. The two are not redundant: this proves each image builds on its
    # own, that one proves the three of them serve a request together, and
    # this one is a check `main` requires by name.
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # compose.yaml gives all three services a read-only root filesystem and a
    # tmpfs for each directory that one genuinely writes to, and DEVELOPERS.md
    # "Option A" says so in prose. Nothing else finds out whether that is true:
    # the `images` job builds the two images and stops, and the setup job
    # starts postgres alone. The riskiest halves are the unproven ones --
    # whether gunicorn survives with only /tmp and /home/app to write to, and
    # whether nginx survives a tmpfs laid over the directory holding the
    # configuration its own base image wrote at build time.
    #
    # Serving a request is the assertion, because that is what a reader of
    # README's quickstart does next -- and then the two commands it tells them
    # to run before any page of it is worth opening.
    steps:
      - uses: actions/checkout@v5
      - name: Configure, as the quickstart says to
        run: cp .env.sample .env
      - uses: docker/setup-buildx-action@v3
      # The two builds below are the quickstart's `--build`, taken out of
      # `compose up` so they can read the same `type=gha` cache the `images`
      # job fills. Built cold here, they were a second `uv sync` over 170
      # packages and a second `npm ci` over 274 on every push.
      #
      # Tagged `<project>-<service>`, which is what compose calls a service it
      # builds itself and so what `up` looks for. compose.yaml fixes the
      # project name, so both names are settled here rather than discovered --
      # asking `compose config --images` for one service answers with more
      # than one line, and a lookup that can pick the wrong one is worse than
      # a convention that is checked. The step after these two checks it.
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: inventory-tng-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: inventory-tng-frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # If compose ever calls them something else, the two builds above were a
      # waste and `up` below would silently build its own -- slower, and this
      # job's whole reason for pre-building gone with no sign of it. So the
      # convention is asserted rather than trusted.
      - name: The names above are the ones compose looks for
        run: |
          compose_wants=$(docker compose config --images)
          for image in inventory-tng-backend inventory-tng-frontend; do
            if ! printf '%s\n' "$compose_wants" | grep -qx "$image"; then
              echo "::error::compose does not look for $image; it wants:"
              printf '%s\n' "$compose_wants"
              exit 1
            fi
          done
      - name: Bring the whole stack up
        run: docker compose up -d
      # --retry-all-errors, not just --retry-connrefused: the ports are
      # published the moment the containers start, so a request arriving before
      # gunicorn is listening is answered by an empty reply rather than
      # refused, and curl retries an empty reply only when told to. The backend
      # migrates before it serves, so this wait is a real one.
      - name: The API answers
        run: |
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:8000/api/healthz | tee /dev/stderr | grep -q '"ok"'
      # The other probe, from outside the process, because the chart tests
      # compare the chart against the URLconf and both come from this tree --
      # so nothing else would notice this path failing to serve out of a built
      # image. It is the path pods are killed over.
      - name: And so does the path liveness asks for
        run: |
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:8000/api/livez | tee /dev/stderr | grep -q '"alive"'
      - name: The app a volunteer opens is served
        run: |
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/ | grep -q 'id="root"'
      # Through nginx rather than around it, which is the path a browser takes
      # and the one the tmpfs over /etc/nginx/conf.d could break on its own.
      - name: The API answers through the frontend's proxy
        run: |
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/api/healthz | grep -q '"ok"'
      # The admin draws itself, which no unit test can say. The suite asserts
      # WhiteNoise is loaded exactly where collectstatic has run -- and in a
      # checkout it has not, so both sides of that are false and the case this
      # is about is exercised nowhere but here. The image is the only place the
      # files exist. inventory-tng-o1uj.1 was every one of these answering 404
      # and the admin rendering as unstyled HTML.
      - name: And the admin's own stylesheets are served
        run: |
          for sheet in base dashboard nav_sidebar responsive; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              "http://localhost:8080/static/admin/css/$sheet.css")
            if [ "$status" != "200" ]; then
              echo "::error::/static/admin/css/$sheet.css answered $status; the Django admin has no styling"
              exit 1
            fi
          done
      # The one README call not optional, in the shape it prints it. Without it
      # the quickstart -- the path written for somebody who has only Docker --
      # would be the one route into this project that nothing runs end to end.
      #
      # createsuperuser asks at a terminal and there is none here, which is why
      # README hands it to a person; the two arguments below are Django's own
      # way to answer it in advance and are not a line this repository asks
      # anybody to type.
      - name: An account to look at it with
        run: |
          docker compose exec -T \
            -e DJANGO_SUPERUSER_PASSWORD=ci-only-not-a-real-password backend \
            python manage.py createsuperuser --noinput \
            --username ci --email ci@example.invalid
      # WAITED FOR, not hoped for. The seeder starts only once the backend is
      # healthy, so it is still running while the steps above are checking
      # URLs, and the assertion below would otherwise be racing it -- passing
      # on this machine, failing on a slower one, for a reason nothing in the
      # output would name. `wait` blocks until the container exits AND returns
      # its exit code, so a seed that refused fails here rather than showing up
      # as absent rows further down.
      - name: The seeder finished, and finished cleanly
        run: |
          # `docker compose wait` was the obvious spelling and answered "no
          # containers for project" on this runner while the stack was plainly
          # up. Asking docker directly for the container works on every version
          # and says more when it fails.
          container=$(docker compose ps -aq seed)
          if [ -z "$container" ]; then
            echo "::error::compose created no seed container, so nothing seeded the stack"
            docker compose ps -a
            exit 1
          fi
          status=$(docker wait "$container")
          docker compose logs seed
          if [ "$status" != "0" ]; then
            echo "::error::the seeder exited $status; the rows asserted below will be missing"
            exit 1
          fi
      # THE SEED IS NOT RUN HERE ANY MORE, and that is the assertion.
      # `compose up` brings up a one-shot `seed` service of its own
      # (inventory-tng-zjqt), so running it again would prove only that the
      # command works -- which the backend suite already covers. What is worth
      # proving is that somebody who types the one command in README gets rows
      # without typing a second, so the rows below are the ONLY seeding this
      # job does.
      - name: "`compose up` alone left rows behind, and the account exists"
        run: |
          docker compose exec -T backend python manage.py shell -c '
          from django.contrib.auth.models import User
          from inventory.models import Item, Label, Location, StockMovement, Volunteer
          for model in (Item, Label, Location, StockMovement, Volunteer):
              assert model.objects.exists(), f"the seed left no {model.__name__} rows"
          assert User.objects.filter(username="ci", is_superuser=True).exists()
          print("catalogue, labels, places, people, ledger and a login: all there")
          '
      # The codes are what a person types into "Scan or type a code", and the
      # seed prints them once in a log nobody keeps. This is the command that
      # answers at any time, and it is exercised here because DEVELOPERS.md
      # hands it to a developer as the way to find them.
      - name: And the label codes can be asked for
        run: |
          docker compose exec -T backend python manage.py show_label_codes \
            | tee /dev/stderr | grep -q "Scan or type any of these"
      # THE ONE THING NOTHING ELSE HERE DOES: a write, through nginx, with a
      # session.
      #
      # Every assertion above this reads, and reading was never what broke.
      # inventory-tng-o1uj.6 was a defect that refused EVERY write in the
      # application -- the scanning flow of decision 0011 and every
      # administrative screen -- and it reached a green build, because nginx
      # forwarded a host without its port and Django then compared an origin no
      # browser had sent. The backend suite could not see it: it drives Django's
      # test client, which never crosses a proxy. The browser suite could not
      # either: it runs against Vite, whose proxy leaves the host alone, and
      # nothing in it saves a batch. This step is the gap those two leave.
      #
      # The session is minted server-side rather than by signing in, because
      # the local path may require a second factor -- decision 0013 as amended,
      # and inventory-tng-o1uj.3 -- and a TOTP
      # dance in bash would be testing the wrong thing. What is under test is
      # the origin comparison, which happens on the request no matter how the
      # session was made.
      - name: A volunteer's batch survives the trip through nginx
        run: |
          set -euo pipefail
          scene=$(docker compose exec -T backend python manage.py shell -c '
          import json
          from django.contrib.auth.models import User
          from django.contrib.sessions.backends.db import SessionStore
          from inventory.models import Item, Location, Volunteer
          user = User.objects.get(username="ci")
          session = SessionStore()
          session["_auth_user_id"] = str(user.pk)
          session["_auth_user_backend"] = "django.contrib.auth.backends.ModelBackend"
          # Django refuses a session without it, so leaving it out reads as an
          # anonymous request and this step would assert nothing about origins.
          session["_auth_user_hash"] = user.get_session_auth_hash()
          session.create()
          print(json.dumps({
              "session": session.session_key,
              "actor": Volunteer.objects.first().pk,
              "item": Item.objects.first().pk,
              "location": Location.objects.first().pk,
          }))
          ' | tail -1)
          echo "$scene"
          # One parse rather than a subprocess per field, and `read` rather
          # than `eval` so that shellcheck can still see what is assigned.
          read -r session actor item location <<<"$(printf '%s' "$scene" | python3 -c '
          import json, sys
          scene = json.load(sys.stdin)
          print(scene["session"], scene["actor"], scene["item"], scene["location"])
          ')"

          # The endpoint index is where a browser is handed its CSRF token, so
          # this is the sequence the app itself performs.
          csrf=$(curl -sf -c - -b "sessionid=$session" http://localhost:8080/api \
            | awk '$6 == "csrftoken" { print $7 }')
          test -n "$csrf"

          body=$(printf '{"kind":"checkout","actor":%s,"movements":[{"item":%s,"quantity":"1","from_location":%s}]}' \
            "$actor" "$item" "$location")
          status=$(curl -s -o /tmp/write.json -w '%{http_code}' \
            -X POST http://localhost:8080/api/stock/transactions \
            -H 'Content-Type: application/json' \
            -H "Origin: http://localhost:8080" \
            -H "X-CSRFToken: $csrf" \
            -b "sessionid=$session; csrftoken=$csrf" \
            --data "$body")
          cat /tmp/write.json
          if grep -q 'Origin checking failed' /tmp/write.json; then
            echo "::error::nginx is forwarding a host Django does not agree with; every write is refused"
            exit 1
          fi
          if [ "$status" != "201" ]; then
            echo "::error::a signed-in write through nginx answered $status"
            exit 1
          fi

          # The same request with the port taken off the host, which is what
          # the defect made nginx forward. Django has to refuse this, or the
          # assertion above passes for a reason that has nothing to do with
          # what is being proxied and would go on passing through the bug.
          refused=$(curl -s -o /tmp/refused.json -w '%{http_code}' \
            -X POST http://localhost:8080/api/stock/transactions \
            -H 'Content-Type: application/json' \
            -H 'Host: localhost' \
            -H "Origin: http://localhost:8080" \
            -H "X-CSRFToken: $csrf" \
            -b "sessionid=$session; csrftoken=$csrf" \
            --data "$body")
          if ! grep -q 'Origin checking failed' /tmp/refused.json; then
            echo "::error::a host with no port was accepted ($refused), so the check above proves nothing"
            cat /tmp/refused.json
            exit 1
          fi
      # Asserting the ledger rather than the status, because a 201 over a
      # transaction that wrote nothing would satisfy the step above.
      - name: And the ledger actually moved
        run: |
          docker compose exec -T backend python manage.py shell -c '
          from inventory.models import StockTransaction
          assert StockTransaction.objects.filter(kind="checkout").exists(), (
              "the write was accepted and no checkout reached the ledger"
          )
          print("the batch is in the ledger")
          '
      # So that the three assertions above cannot start passing for the wrong
      # reason the day somebody drops `read_only` to make something work.
      - name: The root filesystems really are read-only
        run: |
          for service in postgres backend frontend; do
            if docker compose exec -T "$service" sh -c 'touch /proof-of-a-writable-root' 2>/dev/null; then
              echo "::error::$service accepted a write to its root filesystem"
              exit 1
            fi
          done
      - name: What the services said
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop it
        if: always()
        run: docker compose down -v

  setup:
    name: Setup instructions
    runs-on: ubuntu-latest
    # A clean machine, following the two setup documents rather than testing
    # the code they set up. DEVELOPERS.md promises that a command in it works
    # on one of these and calls a command that does not a bug in the guide;
    # this is where that is found out. See DEVELOPERS.md#what-ci-proves.
    #
    # Every command below is typed the way that guide prints it -- bare `uv`,
    # bare `npm`. The prefix this job used to wear was the tell
    # that it was proving something else: the guide's own lines only work in a
    # shell that has mise activated, so activating one is the job, and adding
    # `mise exec --` instead would have been this file quietly working around
    # the very gap it is meant to report.
    #
    # No service container: the guide says to start PostgreSQL with compose and
    # so that is what runs, from compose.yaml. A container declared here would
    # leave the compose file itself unexercised.
    #
    # Twenty minutes is about twice a good run of all of that -- a toolchain, a
    # database, two dependency trees and two servers -- so a step that has hung
    # is stopped rather than left holding a runner until the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # A cache, and with it a decision about what "a clean machine" means
      # here, because caching weakens that claim on one axis and it is worth
      # saying which.
      #
      # It means a machine with nothing of this project installed: no mise, no
      # pinned toolchain, no virtualenv, no node_modules. All of that is still
      # built below out of the guide's own lines, and none of it is restored
      # ready-made -- `mise install`, `uv sync` and `npm install` each run and
      # each has to succeed. What is restored is the pile of archives those
      # three would otherwise download, which on a cold run is 187 MB of
      # wheels and 427 MB of packages and something over a minute of the
      # critical path. Whether a package is still fetchable from its registry
      # is a question about the registry, and a red build here would tell a
      # reader of DEVELOPERS.md nothing they could act on.
      #
      # Keyed on the three files that pin what gets downloaded, and given no
      # restore-keys on purpose: change any of them and the next run is
      # genuinely cold, which is exactly when a lock that cannot be resolved
      # should be found out.
      - name: What was downloaded the last time these were pinned as they are
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/mise
            ~/.cache/uv
            ~/.npm
          key: setup-${{ runner.os }}-${{ hashFiles('mise.toml', 'backend/uv.lock', 'frontend/package-lock.json') }}
      # The one prerequisite the guide names that a runner does not carry,
      # installed with the guide's own line.
      - name: Install mise
        run: curl https://mise.run | sh
      # And activated with the guide's own line too. Each step below is a fresh
      # non-interactive shell, and BASH_ENV is the file such a shell reads as it
      # starts -- so this pair is what "add the line to your shell, then open a
      # new one" amounts to on a runner, and mise's own function and paths are
      # in place before anything else is typed.
      - name: Activate it, and open a new shell
        run: |
          echo 'eval "$(~/.local/bin/mise activate bash)"' >> "$HOME/.activated-shell"
          echo "BASH_ENV=$HOME/.activated-shell" >> "$GITHUB_ENV"
      # The two questions the guide says a new shell should answer, asked of
      # this one. Without this a later `command not found` would look like a
      # missing tool rather than a shell that never picked mise up.
      - name: The shell answers the guide's two questions
        run: |
          mise --version
          mise doctor > "$RUNNER_TEMP/doctor.txt" || true
          grep -q 'activated: yes' "$RUNNER_TEMP/doctor.txt" || {
            echo "::error::mise is installed but this shell has not activated it"
            cat "$RUNNER_TEMP/doctor.txt"
            exit 1
          }
      - name: From a fresh clone to a database with something in it
        run: scripts/bootstrap-dev.sh
      # Ran without complaining is not the same as worked. The screens a new
      # contributor is promised are drawn from these rows.
      - name: The seed left rows behind
        working-directory: backend
        run: |
          uv run python src/manage.py shell -c '
          from inventory.models import Item, Label, Location, StockMovement, Volunteer
          for model in (Item, Label, Location, StockMovement, Volunteer):
              assert model.objects.exists(), f"the seed left no {model.__name__} rows"
          print("catalogue, labels, places, people and ledger: all populated")
          '
      # The last thing bootstrap-dev.sh prints is these two lines and an
      # instruction to run each in a terminal of its own. `setsid` is that
      # terminal: a session per server, so the stop step can take one down
      # along with everything it started, which the reloader's child would
      # otherwise survive.
      #
      # Their output goes to a file and not to this step's. A background
      # process still holding a step's stdout open is how a job whose work has
      # finished goes on waiting for it.
      - name: Start the two servers, as the script signs off telling you to
        run: |
          setsid bash -c 'cd backend && uv run python src/manage.py runserver' \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.session"
          setsid bash -c 'cd frontend && npm install && npm run dev' \
            > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/frontend.session"
      - name: The API answers
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused -sf \
            http://localhost:8000/api/healthz | tee /dev/stderr | grep -q '"ok"'
      # More patience than the API needs: this one waits for an `npm install`
      # on a cold cache before Vite is even started.
      - name: The app a volunteer opens is served
        run: |
          curl --retry 90 --retry-delay 2 --retry-connrefused -sf \
            http://localhost:5173/ | grep -q 'id="root"'
      - name: What the two servers said
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/*.log || true
      - name: Stop them
        if: always()
        run: |
          for session in "$RUNNER_TEMP"/*.session; do
            [ -e "$session" ] || continue
            kill -- -"$(cat "$session")" 2>/dev/null || true
          done

  commit-check:
    name: Guardrail checkers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The checkers are guardrails somebody runs by hand or wires in as a
      # hook, so nothing else would notice them breaking.
      - name: Check the commit checker
        run: scripts/check-commit.test.sh
      - name: Check the batch checker
        run: scripts/check-batch.test.sh
      - name: Check the duplication checker
        run: scripts/check-docs.test.sh
      - name: Check the telemetry checker
        run: scripts/check-telemetry.test.sh
      - name: Check the settings checker
        run: scripts/repo-settings.test.sh
      - name: Check the batch-contents comment
        run: scripts/say-batch.test.sh
      - name: Check the bootstrap script
        run: scripts/bootstrap-dev.test.sh
      - name: Check the setup checker
        run: scripts/check-setup.test.sh
      - name: Check the landing gate
        run: scripts/landing-gate.test.sh
      - name: Check the configuration checker
        run: scripts/check-config.test.sh
      - name: Check the unsynced-issue reader
        run: scripts/unsynced.test.sh
      - name: Check the untriaged-arrival reader
        run: scripts/untriaged.test.sh
      - name: Check the review-cycle reader
        run: scripts/review-cycle.test.sh
      - name: Check the do-not-merge reader
        run: scripts/do-not-merge.test.sh
      - name: Check the issue puller
        run: scripts/pull-new-issues.test.sh
      # And then run it, which none of the above do to their own subject. What
      # it reads here is what a clone is handed before anybody configures
      # anything, so a hook that stopped arriving with the checkout is caught
      # on the push that broke it rather than by the next contributor.
      # --shipped-only because this checkout has no git configuration of its
      # own and nothing here commits; the script's header is why.
      - name: The commit hook this repository ships is intact
        run: scripts/check-setup.sh --shipped-only

  # THE REVIEW CYCLE, HELD WHERE IT CANNOT BE ROUTED AROUND. inventory-tng-x0jp.
  #
  # scripts/landing-gate.sh attests the same fact on the machine that types the
  # merge, which means it can only ever guard the merges it sees: a different
  # spelling, a different machine, a checkout with no hook installed, or the
  # GitHub web UI, and the guard is simply not there. A required check does not
  # care how the merge was spelt or where it came from.
  #
  # This becomes REQUIRED by existing and being named -- scripts/repo-settings.sh
  # derives the required contexts from the job names in this file -- so there is
  # no second list to keep in step. It takes effect on the next run of that
  # script, which is a branch-protection change and is a person's to make.
  #
  # ONLY ON pull_request, because a push to main has no pull request to read and
  # a check that reported nothing there would be permanently pending. The other
  # half of the trigger problem -- evidence posted AFTER the last push, which
  # this would never see -- is review-cycle.yml, which re-runs this.
  #
  # NOT WHILE IT IS A DRAFT, and that is what keeps it from deadlocking the
  # documented flow. The landing gate refuses `gh pr ready` while a check is
  # not green, and the skill marks a batch ready BEFORE asking for the review
  # pass -- so a check that went red the moment a branch existed would refuse
  # to let anybody invite the review that would make it green. It is also the
  # objection DEVELOPERS.md makes to readiness questions living in CI at all:
  # they answer "no" through the whole of building a batch, and a job that
  # fails on almost every run is one people learn to read past.
  #
  # `ready_for_review` is already in this workflow's trigger list, so it starts
  # asking at the moment the batch is offered for review, which is the moment
  # the question becomes a real one. A skipped job satisfies a required context.
  review-cycle:
    name: Review cycle
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      # Both lists in one answer, so the two stages are read from the same
      # moment rather than from two.
      - name: Both passes have left something behind
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --json comments,reviews \
            | python3 scripts/review_cycle.py

  # A PULL REQUEST THAT SAYS DO NOT MERGE, AND IS BELIEVED. What the marker is
  # and why prose could not hold it is DEVELOPERS.md "When a branch is ready to
  # merge". inventory-tng-g4dh.
  #
  # HERE RATHER THAN A LABEL OR A LOCAL HOOK. `enforce_admins` is on, so a
  # required context binds the owner too; it covers the GitHub web interface,
  # which no hook on anybody's machine can see; and it cannot be routed around
  # by spelling the merge differently. A label would need `labeled`/`unlabeled`
  # in the triggers above, and with `cancel-in-progress` set that would restart
  # and cancel the whole suite every time somebody tagged a pull request.
  #
  # ON DRAFTS TOO, unlike the job above. That one is skipped while a branch is
  # being built because it would otherwise answer "no" throughout and teach
  # people to read past it. This one answers "no" only when somebody has asked
  # it to, so there is nothing to read past -- and a spike is usually a draft,
  # which is exactly when the marker most needs to already be in force.
  #
  # NO `edited` TRIGGER, AND THAT IS A GAP RATHER THAN A DECISION. A pull
  # request marked at the moment it is opened is held from its first run, and a
  # pull request already blocked cannot slip past: the only two ways it becomes
  # mergeable are being marked ready and being pushed to, and both are listed
  # above. What is NOT covered is the other direction -- a green, ready pull
  # request whose body is edited to ADD the marker re-runs nothing, so the last
  # green verdict stands and GitHub permits the merge. Removing one is covered
  # by more than a push -- review-cycle.yml re-runs the FAILED jobs on a head,
  # and a marked pull request's copy of this job is one of them -- but that
  # asymmetry is the gap rather than a cure for it: a job that PASSED is not
  # re-run by anything.
  #
  # `edited` cannot simply be added here: with `cancel-in-progress` on this
  # workflow, a title typo would restart and cancel the browser suite. The shape
  # that fits is the one review-cycle.yml already uses for its own staleness --
  # a separate, non-required workflow that re-runs this job -- and it is
  # `inventory-tng-qe31`. Until then scripts/landing-gate.sh reads the body
  # itself at merge time, which covers the path this was built for.
  do-not-merge:
    name: Not marked do-not-merge
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - name: The body does not post the marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --json body | python3 scripts/do_not_merge.py

  history:
    name: One issue per commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Only this job says anything back; the rest read.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole range, not the tip: this reads every commit the pull
          # request adds.
          fetch-depth: 0
      # No commit may hold work from two issues -- the rule this repository is
      # arranged around, and the one a tidy-looking branch breaks most easily.
      # See DEVELOPERS.md#pull-requests
      #
      # The membership check needs the beads tracker and simply sits out when
      # there is none, so a contributor working from GitHub issues is held to
      # the structural rules and nothing else. See DEVELOPERS.md#issue-tracking
      # ALWAYS --unfinished, and the reason is the whole of inventory-tng-ee2c.
      #
      # It was --draft, passed only while the pull request was a GitHub draft,
      # and that flag ends at `gh pr ready` -- which is exactly when this
      # project's review cycle BEGINS. So the two objections about a branch
      # being unfinished were asked on every push through both halves of the
      # documented flow: while a batch is built one issue at a time, and while
      # fixups are being folded in. Measured across every pull request run this
      # repository has, the job failed on 48% of them, and the failure was the
      # process doing exactly what it is told.
      #
      # What is still refused here is everything structural -- one issue per
      # commit, an issue landed that the batch does not hold, the message rules
      # -- none of which is ever temporarily true, and all of which is worth
      # holding a fork's pull request to where no local hook runs.
      #
      # The finished question is asked once, by scripts/landing-gate.sh, at the
      # merge. See DEVELOPERS.md#when-a-branch-is-ready-to-merge.
      - name: Check the commits in this pull request
        run: |
          scripts/check-batch.sh --unfinished \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      # Said here rather than typed into the description, so the list is the one
      # that was checked. A fork's token cannot comment, and that is not a
      # reason to fail the check that matters.
      - name: Say what the batch holds
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RANGE: "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          PR: ${{ github.event.pull_request.number }}
        run: scripts/say-batch.sh || echo "::warning::Could not post the batch list."

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Documentation here is heavily cross-linked by design -- one topic lives
      # in one file and everything else links to it. The first two steps are
      # what stop that arrangement rotting: the first when a link's target
      # moves, the second when an explanation is pasted into a second file
      # instead of being linked to. See DEVELOPERS.md#documentation-rules
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --include-fragments '**/*.md'
          fail: true
      - name: Check for duplicated prose
        run: scripts/check-docs.sh
      # And the configuration, for the same reason: a value added without a
      # word about it is caught on the push that added it.
      - name: Every configuration value says what it is for
        run: scripts/check-config.sh
      # The third is the same kind of rule about code rather than prose: work
      # that changes something has to say so. It sits here because it is
      # enforcement of a written rule, and because like check-docs.sh it needs
      # nothing but a checkout. See DEVELOPERS.md#definition-of-done
      - name: Check for silent changes
        run: scripts/check-telemetry.sh
