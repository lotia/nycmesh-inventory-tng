name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv publishes full version tags only, so this one is exact.
      # The uv mise.toml pins, as everyone runs (CONTRIBUTING.md, Dependency
      # updates).
      - id: uv
        run: |
          version=$(sed -n 's/^uv = "\([0-9.]*\)".*/\1/p' mise.toml)
          [ "$(printf '%s\n' "$version" | wc -l)" = 1 ] && [ -n "$version" ] ||
            { echo "No single uv pin in mise.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
        working-directory: .
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.uv.outputs.version }}
          cache-python: true
      # Started now, so the database comes up while the checks before it run.
      - run: docker compose up -d db
        working-directory: .
      - run: uv sync --locked
      - run: uv run ty check
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: docker compose up -d --wait db
        working-directory: .
      - run: uv run pytest

  # Each check its own step, run directly, with the versions mise.toml pins.
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Only to install them: CI runs no mise tasks.
      - uses: jdx/mise-action@v5.2.0
        with:
          install_args: shellcheck taplo
      - run: shellcheck mise-tasks/*
      - run: taplo lint
        env:
          RUST_LOG: warn
      - run: taplo fmt --check
        env:
          RUST_LOG: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/tools/openapi/package-lock.json
      - run: npm ci
      # The generated API types must match the committed schema.
      - run: npm run api
      # New files count too: intent-to-add puts them in the diff.
      - run: git add --intent-to-add src/api && git diff --exit-code -- src/api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
