name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review is not one of the defaults, and the history job below
    # reads draft state. See DEVELOPERS.md#merging.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: docker.io/library/postgres:18
        env:
          POSTGRES_DB: inventory_tng
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_tng
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # test_chart.py renders the deployment chart and holds it against these
      # settings, so this job needs helm. The runner image happens to ship one;
      # depending on that would make an unrelated job fail the day it stops.
      - uses: azure/setup-helm@v4
      - run: uv sync --locked
      # Commands mirror DEVELOPERS.md "Code style" and "Testing and coverage".
      # Thresholds and rules live in backend/pyproject.toml, not here, so a
      # local run and this job enforce identical rules.
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check src
      - name: Test and coverage
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Commands mirror DEVELOPERS.md "Code style" and "Testing and coverage".
      # Rules and thresholds live in frontend/biome.json and
      # frontend/vite.config.ts, not here.
      - name: Lint and format check
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test and coverage
        run: npm test
      - name: Build
        run: npm run build

  integration:
    name: Integration (browser)
    runs-on: ubuntu-latest
    # Cannot be run by either job above; see DEVELOPERS.md "Integration tests".
    services:
      postgres:
        image: docker.io/library/postgres:18
        env:
          POSTGRES_DB: inventory_tng
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgres://inventory:inventory@localhost:5432/inventory_tng
      # The seed command refuses to run without this, deliberately: it creates
      # a login whose password is in the repository.
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: backend
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # The browser is a 115MB download, so it is cached on the resolved
      # version rather than fetched on every run.
      - name: Resolve browser version
        id: playwright
        working-directory: frontend
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Install browser dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend
      # Playwright starts Django and Vite itself, migrates and seeds. See
      # frontend/playwright.config.ts.
      - name: Integration tests
        run: npm run test:integration
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    # Every render docs/deployment.md prints, and no more, because a runner has
    # no cluster to install into. All of them here rather than some of them
    # here and some in the setup job: the variants differ from the plain render
    # by a flag or two, and a chart that has stopped rendering should say so
    # once. See DEVELOPERS.md#what-ci-proves.
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint infra/helm/inventory-tng
      - name: Render manifests
        run: helm template test infra/helm/inventory-tng --set image.tag=ci
      # The administrative ingress is off by default, so the plain render above
      # never draws it. The grep is the assertion: rendering clean while
      # producing no second host and no address restriction would be a chart
      # that has quietly stopped offering what the document sells.
      - name: Render them again with the administrative ingress on
        run: |
          helm template test infra/helm/inventory-tng --set image.tag=ci \
            --set ingress.administrative.enabled=true \
            --set 'ingress.administrative.allowedSourceRanges={10.69.0.0/16}' \
            | grep -E 'name:.*-admin|whitelist|^ +- path:'

  images:
    name: Container images
    runs-on: ubuntu-latest
    # Both images, built from a matrix so a broken Dockerfile is named by the
    # job that failed. This is also what fills the `type=gha` cache the
    # `Compose stack` job below reads, which is why that one does not build
    # cold. The two are not redundant: this proves each image builds on its
    # own, that one proves the three of them serve a request together, and
    # this one is a check `main` requires by name.
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # compose.yaml gives all three services a read-only root filesystem and a
    # tmpfs for each directory that one genuinely writes to, and DEVELOPERS.md
    # "Option A" says so in prose. Nothing else finds out whether that is true:
    # the `images` job builds the two images and stops, and the setup job
    # starts postgres alone. The riskiest halves are the unproven ones --
    # whether gunicorn survives with only /tmp and /home/app to write to, and
    # whether nginx survives a tmpfs laid over the directory holding the
    # configuration its own base image wrote at build time.
    #
    # Serving a request is the assertion, because that is what a reader of
    # README's quickstart does next -- and then the two commands it tells them
    # to run before any page of it is worth opening.
    steps:
      - uses: actions/checkout@v5
      - name: Configure, as the quickstart says to
        run: cp .env.sample .env
      - uses: docker/setup-buildx-action@v3
      # The two builds below are the quickstart's `--build`, taken out of
      # `compose up` so they can read the same `type=gha` cache the `images`
      # job fills. Built cold here, they were a second `uv sync` over 170
      # packages and a second `npm ci` over 274 on every push.
      #
      # Tagged `<project>-<service>`, which is what compose calls a service it
      # builds itself and so what `up` looks for. compose.yaml fixes the
      # project name, so both names are settled here rather than discovered --
      # asking `compose config --images` for one service answers with more
      # than one line, and a lookup that can pick the wrong one is worse than
      # a convention that is checked. The step after these two checks it.
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: inventory-tng-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: inventory-tng-frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # If compose ever calls them something else, the two builds above were a
      # waste and `up` below would silently build its own -- slower, and this
      # job's whole reason for pre-building gone with no sign of it. So the
      # convention is asserted rather than trusted.
      - name: The names above are the ones compose looks for
        run: |
          compose_wants=$(docker compose config --images)
          for image in inventory-tng-backend inventory-tng-frontend; do
            if ! printf '%s\n' "$compose_wants" | grep -qx "$image"; then
              echo "::error::compose does not look for $image; it wants:"
              printf '%s\n' "$compose_wants"
              exit 1
            fi
          done
      - name: Bring the whole stack up
        run: docker compose up -d
      # --retry-all-errors, not just --retry-connrefused: the ports are
      # published the moment the containers start, so a request arriving before
      # gunicorn is listening is answered by an empty reply rather than
      # refused, and curl retries an empty reply only when told to. The backend
      # migrates before it serves, so this wait is a real one.
      - name: The API answers
        run: |
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:8000/api/healthz | tee /dev/stderr | grep -q '"ok"'
      # The other probe, from outside the process, because the chart tests
      # compare the chart against the URLconf and both come from this tree --
      # so nothing else would notice this path failing to serve out of a built
      # image. It is the path pods are killed over.
      - name: And so does the path liveness asks for
        run: |
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:8000/api/livez | tee /dev/stderr | grep -q '"alive"'
      - name: The app a volunteer opens is served
        run: |
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/ | grep -q 'id="root"'
      # Through nginx rather than around it, which is the path a browser takes
      # and the one the tmpfs over /etc/nginx/conf.d could break on its own.
      - name: The API answers through the frontend's proxy
        run: |
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/api/healthz | grep -q '"ok"'
      # The two README calls not optional, in the shape it prints them. Without
      # these the quickstart -- the path written for somebody who has only
      # Docker -- would be the one route into this project that nothing runs
      # end to end. The seed also refuses unless DEBUG is on, so this is where
      # it is found out that `cp .env.sample .env` is what supplies it.
      #
      # createsuperuser asks at a terminal and there is none here, which is why
      # README hands it to a person; the two arguments below are Django's own
      # way to answer it in advance and are not a line this repository asks
      # anybody to type.
      - name: Something to look at, and an account to look at it with
        run: |
          docker compose exec -T backend python manage.py seed_demo_data
          docker compose exec -T \
            -e DJANGO_SUPERUSER_PASSWORD=ci-only-not-a-real-password backend \
            python manage.py createsuperuser --noinput \
            --username ci --email ci@example.invalid
      - name: The seed left rows behind, and the account exists
        run: |
          docker compose exec -T backend python manage.py shell -c '
          from django.contrib.auth.models import User
          from inventory.models import Item, Label, Location, StockMovement, Volunteer
          for model in (Item, Label, Location, StockMovement, Volunteer):
              assert model.objects.exists(), f"the seed left no {model.__name__} rows"
          assert User.objects.filter(username="ci", is_superuser=True).exists()
          print("catalogue, labels, places, people, ledger and a login: all there")
          '
      # So that the three assertions above cannot start passing for the wrong
      # reason the day somebody drops `read_only` to make something work.
      - name: The root filesystems really are read-only
        run: |
          for service in postgres backend frontend; do
            if docker compose exec -T "$service" sh -c 'touch /proof-of-a-writable-root' 2>/dev/null; then
              echo "::error::$service accepted a write to its root filesystem"
              exit 1
            fi
          done
      - name: What the services said
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop it
        if: always()
        run: docker compose down -v

  setup:
    name: Setup instructions
    runs-on: ubuntu-latest
    # A clean machine, following the two setup documents rather than testing
    # the code they set up. DEVELOPERS.md promises that a command in it works
    # on one of these and calls a command that does not a bug in the guide;
    # this is where that is found out. See DEVELOPERS.md#what-ci-proves.
    #
    # Every command below is typed the way that guide prints it -- bare `uv`,
    # bare `npm`. The prefix this job used to wear was the tell
    # that it was proving something else: the guide's own lines only work in a
    # shell that has mise activated, so activating one is the job, and adding
    # `mise exec --` instead would have been this file quietly working around
    # the very gap it is meant to report.
    #
    # No service container: the guide says to start PostgreSQL with compose and
    # so that is what runs, from compose.yaml. A container declared here would
    # leave the compose file itself unexercised.
    #
    # Twenty minutes is about twice a good run of all of that -- a toolchain, a
    # database, two dependency trees and two servers -- so a step that has hung
    # is stopped rather than left holding a runner until the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # A cache, and with it a decision about what "a clean machine" means
      # here, because caching weakens that claim on one axis and it is worth
      # saying which.
      #
      # It means a machine with nothing of this project installed: no mise, no
      # pinned toolchain, no virtualenv, no node_modules. All of that is still
      # built below out of the guide's own lines, and none of it is restored
      # ready-made -- `mise install`, `uv sync` and `npm install` each run and
      # each has to succeed. What is restored is the pile of archives those
      # three would otherwise download, which on a cold run is 187 MB of
      # wheels and 427 MB of packages and something over a minute of the
      # critical path. Whether a package is still fetchable from its registry
      # is a question about the registry, and a red build here would tell a
      # reader of DEVELOPERS.md nothing they could act on.
      #
      # Keyed on the three files that pin what gets downloaded, and given no
      # restore-keys on purpose: change any of them and the next run is
      # genuinely cold, which is exactly when a lock that cannot be resolved
      # should be found out.
      - name: What was downloaded the last time these were pinned as they are
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/mise
            ~/.cache/uv
            ~/.npm
          key: setup-${{ runner.os }}-${{ hashFiles('mise.toml', 'backend/uv.lock', 'frontend/package-lock.json') }}
      # The one prerequisite the guide names that a runner does not carry,
      # installed with the guide's own line.
      - name: Install mise
        run: curl https://mise.run | sh
      # And activated with the guide's own line too. Each step below is a fresh
      # non-interactive shell, and BASH_ENV is the file such a shell reads as it
      # starts -- so this pair is what "add the line to your shell, then open a
      # new one" amounts to on a runner, and mise's own function and paths are
      # in place before anything else is typed.
      - name: Activate it, and open a new shell
        run: |
          echo 'eval "$(~/.local/bin/mise activate bash)"' >> "$HOME/.activated-shell"
          echo "BASH_ENV=$HOME/.activated-shell" >> "$GITHUB_ENV"
      # The two questions the guide says a new shell should answer, asked of
      # this one. Without this a later `command not found` would look like a
      # missing tool rather than a shell that never picked mise up.
      - name: The shell answers the guide's two questions
        run: |
          mise --version
          mise doctor > "$RUNNER_TEMP/doctor.txt" || true
          grep -q 'activated: yes' "$RUNNER_TEMP/doctor.txt" || {
            echo "::error::mise is installed but this shell has not activated it"
            cat "$RUNNER_TEMP/doctor.txt"
            exit 1
          }
      - name: From a fresh clone to a database with something in it
        run: scripts/bootstrap-dev.sh
      # Ran without complaining is not the same as worked. The screens a new
      # contributor is promised are drawn from these rows.
      - name: The seed left rows behind
        working-directory: backend
        run: |
          uv run python src/manage.py shell -c '
          from inventory.models import Item, Label, Location, StockMovement, Volunteer
          for model in (Item, Label, Location, StockMovement, Volunteer):
              assert model.objects.exists(), f"the seed left no {model.__name__} rows"
          print("catalogue, labels, places, people and ledger: all populated")
          '
      # The last thing bootstrap-dev.sh prints is these two lines and an
      # instruction to run each in a terminal of its own. `setsid` is that
      # terminal: a session per server, so the stop step can take one down
      # along with everything it started, which the reloader's child would
      # otherwise survive.
      #
      # Their output goes to a file and not to this step's. A background
      # process still holding a step's stdout open is how a job whose work has
      # finished goes on waiting for it.
      - name: Start the two servers, as the script signs off telling you to
        run: |
          setsid bash -c 'cd backend && uv run python src/manage.py runserver' \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.session"
          setsid bash -c 'cd frontend && npm install && npm run dev' \
            > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/frontend.session"
      - name: The API answers
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused -sf \
            http://localhost:8000/api/healthz | tee /dev/stderr | grep -q '"ok"'
      # More patience than the API needs: this one waits for an `npm install`
      # on a cold cache before Vite is even started.
      - name: The app a volunteer opens is served
        run: |
          curl --retry 90 --retry-delay 2 --retry-connrefused -sf \
            http://localhost:5173/ | grep -q 'id="root"'
      - name: What the two servers said
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/*.log || true
      - name: Stop them
        if: always()
        run: |
          for session in "$RUNNER_TEMP"/*.session; do
            [ -e "$session" ] || continue
            kill -- -"$(cat "$session")" 2>/dev/null || true
          done

  commit-check:
    name: Guardrail checkers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The checkers are guardrails somebody runs by hand or wires in as a
      # hook, so nothing else would notice them breaking.
      - name: Check the commit checker
        run: scripts/check-commit.test.sh
      - name: Check the batch checker
        run: scripts/check-batch.test.sh
      - name: Check the duplication checker
        run: scripts/check-docs.test.sh
      - name: Check the telemetry checker
        run: scripts/check-telemetry.test.sh
      - name: Check the settings checker
        run: scripts/repo-settings.test.sh
      - name: Check the batch-contents comment
        run: scripts/say-batch.test.sh
      - name: Check the bootstrap script
        run: scripts/bootstrap-dev.test.sh
      - name: Check the setup checker
        run: scripts/check-setup.test.sh
      - name: Check the landing gate
        run: scripts/landing-gate.test.sh
      # And then run it, which none of the above do to their own subject. What
      # it reads here is what a clone is handed before anybody configures
      # anything, so a hook that stopped arriving with the checkout is caught
      # on the push that broke it rather than by the next contributor.
      # --shipped-only because this checkout has no git configuration of its
      # own and nothing here commits; the script's header is why.
      - name: The commit hook this repository ships is intact
        run: scripts/check-setup.sh --shipped-only

  history:
    name: One issue per commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Only this job says anything back; the rest read.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole range, not the tip: this reads every commit the pull
          # request adds.
          fetch-depth: 0
      # No commit may hold work from two issues -- the rule this repository is
      # arranged around, and the one a tidy-looking branch breaks most easily.
      # See DEVELOPERS.md#pull-requests
      #
      # The membership check needs the beads tracker and simply sits out when
      # there is none, so a contributor working from GitHub issues is held to
      # the structural rules and nothing else. See DEVELOPERS.md#issue-tracking
      # --draft while the pull request is one. See DEVELOPERS.md#merging.
      - name: Check the commits in this pull request
        run: |
          scripts/check-batch.sh \
            ${{ github.event.pull_request.draft && '--draft' || '' }} \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      # Said here rather than typed into the description, so the list is the one
      # that was checked. A fork's token cannot comment, and that is not a
      # reason to fail the check that matters.
      - name: Say what the batch holds
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RANGE: "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          PR: ${{ github.event.pull_request.number }}
        run: scripts/say-batch.sh || echo "::warning::Could not post the batch list."

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Documentation here is heavily cross-linked by design -- one topic lives
      # in one file and everything else links to it. The first two steps are
      # what stop that arrangement rotting: the first when a link's target
      # moves, the second when an explanation is pasted into a second file
      # instead of being linked to. See DEVELOPERS.md#documentation-rules
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --include-fragments '**/*.md'
          fail: true
      - name: Check for duplicated prose
        run: scripts/check-docs.sh
      # The third is the same kind of rule about code rather than prose: work
      # that changes something has to say so. It sits here because it is
      # enforcement of a written rule, and because like check-docs.sh it needs
      # nothing but a checkout. See DEVELOPERS.md#definition-of-done
      - name: Check for silent changes
        run: scripts/check-telemetry.sh
