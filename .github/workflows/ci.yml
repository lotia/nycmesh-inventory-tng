name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request's newer run replaces its older one; on main every push
  # runs to the end, as check-changed-lines checks only the lines it brought.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      # Started now, so the database comes up while the checks before it run.
      - run: docker compose up -d db
        working-directory: .
      - run: uv sync --locked
      - run: uv run ty check
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: docker compose up -d --wait db
        working-directory: .
      # Held to the floor in pyproject.toml; coverage.xml for check-changed-lines.
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # One job per check, as the mise tasks are, so one failing never hides
  # another. mise only installs each job's tool, at the version mise.toml
  # pins: CI runs no mise tasks.
  check-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.0
        with:
          install_args: shellcheck
      - run: shellcheck mise-tasks/*

  check-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.0
        with:
          install_args: node npm:markdownlint-cli2
      - run: markdownlint-cli2

  check-toml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUST_LOG: warn
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.0
        with:
          install_args: taplo
      - run: taplo lint
      - run: taplo fmt --check

  check-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/tools/openapi/package-lock.json
      - run: npm ci
      # The generated API types must match the committed schema.
      - run: npm run api
      # New files count too: intent-to-add puts them in the diff.
      - run: git add --intent-to-add src/api && git diff --exit-code -- src/api
      - run: npm run typecheck
      - run: npm run lint
      # Held to the floors in vite.config.ts; the report for check-changed-lines.
      - run: npm run coverage
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/cobertura-coverage.xml
      - run: npm run build

  # The built app in real browsers, Chromium and WebKit, at a phone's width
  # (frontend/browser/, CONTRIBUTING.md: Running the checks).
  check-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose up -d db
        working-directory: .
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
      # The browsers, kept between runs for the version package-lock.json
      # pins; installing skips them when cached, but not the system
      # libraries they need.
      - id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Full Chromium (playwright.config.ts), not its headless shell.
      - run: npx playwright install --with-deps --no-shell chromium webkit
      - run: npm run build
      - run: docker compose up -d --wait db
        working-directory: .
      - run: npx playwright test

  # Every line a push or pull request adds or changes is run by a test
  # (CONTRIBUTING.md: Coverage). Changes go straight to main, so a push is
  # compared with what main was before it, not with origin/main, which
  # already holds it.
  check-changed-lines:
    needs: [check-backend, check-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The commit to compare with must be here.
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv
      - uses: actions/download-artifact@v8.0.2
        with:
          name: backend-coverage
          path: backend
      - uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage
      # What main was before the push, or a pull request's base. When that
      # commit is not here (main pushed for the first time, all zeros, or
      # rewritten with a force push), the commit before HEAD, with a warning.
      - id: base
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=${PR_BASE:-$BEFORE}
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::$base is not in this clone: comparing with HEAD~1"
            base=HEAD~1
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - env:
          BASE: ${{ steps.base.outputs.ref }}
        run: >-
          uv run --project backend --locked --only-group coverage diff-cover
          -c backend/pyproject.toml
          backend/coverage.xml frontend/coverage/cobertura-coverage.xml
          --compare-branch="$BASE"
