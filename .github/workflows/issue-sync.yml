name: Issue sync

# Say when the tracker and the GitHub issue list are holding different work.
#
# The arrangement this belongs to -- how the two lists of work relate, and why
# noticing is CI's whole part in it -- is
# docs/decisions/0031-the-issue-list-is-a-window-on-the-tracker.md.
#
# What that gap is, and why `bd` cannot close it alone, is on
# scripts/pull-new-issues.sh, which is the part that finds them. This file is
# the answer to "who notices", because the people who would run that by hand
# are exactly the people already using the tracker. `inventory-tng-cwpa.3`.
#
# IT REPORTS, IT DOES NOT PROPOSE, and it used to do the opposite. It built a
# tracker in the runner, pulled what was missing, pushed a branch and opened a
# pull request -- which could never merge, because GitHub starts no workflow run
# for a push made with GITHUB_TOKEN, so every required context on that branch
# stayed "Expected -- waiting for status to be reported" for ever. Nothing
# announced that: the job reported success and the pull request looked ordinary.
# `inventory-tng-qnxb` measured it and settled the shape.
#
# WHY A RED CHECK RATHER THAN A PULL REQUEST, which is the decision rather than
# the mechanism. "There are issues bd has not heard of" is a STATE, not an
# event. A pull request announces an event once and then rots: if nobody acts,
# nothing raises it again, and it sits in the list looking like work in
# progress. A job that is red while the thing is true and green when it stops
# being true re-raises itself every morning and needs no cleaning up -- it
# clears the moment somebody runs the script, with nothing to close.
#
# AND IT LANDS NOTHING, deliberately. Pulling in a runner writes to a database
# that is thrown away, so the only thing that ever persisted was the commit --
# which is what could not merge. Landing tracker rows stays a person's job,
# through the command named in the failure below and in
# DEVELOPERS.md#issue-tracking.
#
# NOT IN ci.yml, and that is load-bearing: scripts/repo-settings.sh derives
# main's required contexts from the job names there, so a job put in that file
# becomes required -- and this one must not be. It answers a question about the
# repository rather than about a branch, so it would sit red on every pull
# request anybody opened while an issue was waiting. Same reason
# review-cycle.yml is its own file.

on:
  # A person, when they want it.
  workflow_dispatch:
  # Somebody filing or reopening an issue is exactly the event this exists for.
  issues:
    types: [opened, reopened]
  # And a sweep, which is what makes this a standing signal rather than a
  # notification: it asks again every morning for as long as the answer is yes,
  # and it catches what the event missed -- a delivery that failed, or an issue
  # transferred in, which raises no `opened` here.
  schedule:
    - cron: "17 7 * * *"

# One at a time. Nothing here writes, so a race would only waste a runner --
# but two reds saying the same thing is two people going to look.
concurrency:
  group: issue-sync
  cancel-in-progress: false

# READ ONLY, and it is worth saying what that costs: this cannot bring an issue
# in, and is not meant to. The old version needed `contents: write` and
# `pull-requests: write` to push a branch and open the pull request that could
# not merge.
permissions:
  contents: read
  issues: read

jobs:
  unsynced:
    name: The tracker and the issue list disagree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # NO `bd`, which is most of what this file used to be. Installing it meant
      # a pinned release, a checksum, moving .beads/config.yaml aside so `bd
      # init` did not try to clone a remote the runner has no key for, and a
      # `git reset --hard` afterwards to undo what it scaffolded --
      # inventory-tng-t3w9, -65ij, -rbvb and -y466, every one of them a repair
      # to machinery that existed only to build a commit nothing could land.
      #
      # `--check` needs none of it: scripts/unsynced.py compares the URLs GitHub
      # gives against the `external_ref`s in the committed export, and the
      # export is in the checkout. It did not always say so -- the script
      # demanded `bd` on the path for a question it answers from that export
      # alone, so the first dispatch of this rewrite exited 2 before asking
      # anything.
      #
      # ONE `run:` LINE, and the script decides. Why the refusal lives there
      # rather than here is on `--check` itself; settings.yml is the same shape.
      - name: Ask which issues no bead points at
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/pull-new-issues.sh --check

      # THE SAME QUESTION FROM THE OTHER END, and until inventory-tng-cwpa.9 it
      # was not asked at all: a bead created on somebody's machine and committed
      # was filed nowhere, and nothing said so -- not on the next commit, not on
      # the next morning, not ever.
      #
      # RUN EVEN WHEN THE STEP ABOVE FAILED, which is the whole of why this is a
      # second STEP rather than a second JOB. One red check is one thing to go
      # and look at, and the two halves are one concern. But a step that fails
      # stops the job, so without this the push half would go unasked for as
      # long as the pull half was red -- somebody fixes one, and learns about
      # the other tomorrow.
      #
      # `!cancelled()` rather than `always()`: a failed step is what this has to
      # survive, and a CANCELLED run is not. `always()` runs on cancellation
      # too, which turns "somebody stopped this" into a report about the
      # tracker, made from a checkout that may not have finished.
      #
      # It reaches for nothing: no token, no `gh`, no `bd`. That is what lets it
      # sit here rather than needing a runner of its own -- see the script.
      - name: Ask which beads have no issue
        if: ${{ !cancelled() }}
        run: scripts/export-issues.sh --check
